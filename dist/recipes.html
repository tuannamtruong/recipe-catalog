 mins.\n", "slug": "oven-chicken-legs"}, {"frontmatter": {"title": "Pan Sauce 2 (Steak diane is better)", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/video/3760/pan-seared-chicken-breasts-with-shallots/"}, "body": "## Ingredients\n- Seared sth (Chicken breast, pork  chop)\n- Shallot or onion\n- (And) Garlic\n- Wine\n- Butter\n- Broth/Water\n- Mustard\n\n## Steps\n1. Shallots and garlic into skillet over medium heat, and cook until tender. (30s)\n2. Stir in wine, and cook until heated through. (Reduced the alcohol)\n3. Stir in broth/water and mustard, reduce to slightly thickened.\n4. Remove skillet from heat.\n5. Butter in until melted during cooldown.\n", "slug": "pan-sauce-2-steak-diane-is-better"}, {"frontmatter": {"title": "Pan sauce 3 ( todo)", "categories": ["Sauce"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=NTBRThwL-2c"}, "body": "## Ingredients\n- \n\n## Steps\n1. \n", "slug": "pan-sauce-3-todo"}, {"frontmatter": {"title": "Pancake", "categories": ["Dessert"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/MeDAMraTwaM"}, "body": "## Ingredients\n- 1 egg\n- 50g greek yogurt\n- 35g flour (oat flour?)\n- 1tsp baking powder\n- 30g protein powder\n- 80ml milk\n- sweetener of choice\n- topping:\n- Choco\n- berries and almond\n- banana and nut\n\n## Steps\n1. Mix everything until smooth.\n2. Put inside an oven 175C for 30 mins.\n", "slug": "pancake"}, {"frontmatter": {"title": "Peanut butter sauce", "categories": ["Sauce"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=fMqmdc7dR88"}, "body": "## Ingredients\n- Makes about 3/2 cup Peanut Dipping Sauce:\n- 3/4 cup smooth all-natural, pure peanut butter\n- 2 cloves garlic, finely minced\n- 2 tbsp brown sugar\n- 1 tbsp fish sauce\n- 2 tsp soy sauce\n- 2 tsp sesame oil\n- 1/2 lime, juiced\n- 165ml coconut milch\n\n## Steps\n1. Mix erverything together, except coconut milk.\n2. Cook cmilk in med heat, when hot move to the mixture.\n", "slug": "peanut-butter-sauce"}, {"frontmatter": {"title": "Peanut Curry Chicken", "categories": ["Chicken"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g thịt gà\n- Mix gia vị\n- 1 tsp coriander\n- 1 tsp cumin\n- 1/2 tsp tumeric\n- 1/2 tsp paprika\n- 1/2 tbs salt\n- Main\n- 1 tbs oil\n- 1/2 onion, chopped\n- 1/2 tbs ginger, grated\n- 3 garlic cloves, minced\n- 1/4 cup ketchup\n- 3/8 cup peanut butter\n- (-1 tbs brown sugar[ if peanut butter contains no sugar])\n- 7/4 cup chicken broth (circa 420ml)\n- 2 zucchini, cut into chunks\n- 1 red pepper, diced\n- 1/4 roasted peanut\n- chopped cilantro, 1 lime\n\n## Steps\n1. Mix tất cả gia vị với nhau trong 1 bát nhỏ\n2. Cắt gà miếng vừa, để trong một bát to, đổ 1 nửa gia vị vào, trộn đều. Cho vào tủ lạnh qua đêm hoặc nấu luôn\n3. Cho dầu ăn vào nồi nóng. Rán thịt  ở high-heat khi thịt nâu, cho thịt vào lại bát\n4. Lửa xuống medium-heat. Cho hành vào và nấu khi hành vàng 1 chút\n5. Cho gừng và tỏi vào đảo tầm 1 phút\n6. Cho phần gia vị còn lại vào, đảo tầm 1 phút\n7. Cho nước hầm gà, gà rán vào\n8. Cho ketchup, peanut butter vào đảo. Lửa lên high-heat để nồi sôi. Khi sôi rồi thì xuống medium-heat. Đun tầm 30 phút. Thỉnh th9oảng đảo.\n9. Cho zucchini, bell pepper và lạc vào 1 bát. Đổ vào nồi. Và đun thêm tầm 30-40 phút đến khi mềm.\n10. Khi ăn thì thêm cilantro và ít chanh vắt\n", "slug": "peanut-curry-chicken"}, {"frontmatter": {"title": "Peppercorn sauce", "categories": ["Sauce"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=FPRvZwx5Ris"}, "body": "## Ingredients\n- 1 tbsp rapeseed or sunflower oil\n- 1 medium shallot, finely chopped\n- 1 clove garlic, crushed or finely grated\n- 1 tbsp black or green peppercorns\n- 2 tbsp brandy\n- 500g Beef Stock\n- 100ml whipping cream\n- 2 tsp Dijon mustard\n\n## Steps\n1. Med low heat\n2. Shallot in the pan with pinch of salt\n3. Shortly before any liquid, add garlic and peppercorn for 1 min.\n4. Add brandy and stock\n5. Boil and reduce it down.\n6. Put in a fridge or keep cooking\n7. Lower heat\n8. Add whipping cream and mustard\n9. Cook until thick enough\n", "slug": "peppercorn-sauce"}, {"frontmatter": {"title": "Picadillo", "categories": ["Uncategorized"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": "https://foodwishes.blogspot.com/2017/02/picadillo-close-but-no-cigar.html"}, "body": "## Ingredients\n- 500g thịt\n- 2 tsp oil\n- 1 cup yellow onion ( 1 onion?)\n- 1 tsp salt\n- 0,5 tsp pepper\n- 2 tsp cumin\n- 0,5 tsp cinnamon\n- 2 bay leaves\n- 0,25 tsp cayenne\n- 4 cloves garlic, minced\n- 1 tbs vinegar\n- 2 cups crushed tomatoes (approx.. 500ml) (xoay nhuyễn best)\n- 1/4 cup water\n- 1/4 cup currant or raisins\n\n## Steps\n1. med-high brown meat.\n2. Onion and salt\n3. Đảo đều tầm 3-5 phút gì đó.\n4. Cho tiêu, thìa là, quế, gia vị cay, (lá nguyệt quế).\n5. Đảo tầm 1-2 phút gì đó rồi cho tỏi vào.\n6. Đảo tiếp tầm 1-2 phút\n7. Cho dấm và cà chua vô\n8. Đảo chút rồi cho nước vào\n9. Đảo chút cho nho vào\n10. Đậy nắp cho lửa med-owl đun tầm 15-20 phút hoặc vừa\n11. Olive in\n", "slug": "picadillo"}, {"frontmatter": {"title": "Pork Rib Soup", "categories": ["Pork"], "prep_minutes": 60, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 600g pork loin\n- Onion\n- Vegtable of choice\n\n## Steps\n1. Boil: chop + 1 onion + salt. 1 hour\n2. Add vegtable for another hour\n", "slug": "pork-rib-soup"}, {"frontmatter": {"title": "Pork Rib with BBQ Sauce", "categories": ["Pork"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": "https://www.inspiredtaste.net/7179/sweet-and-spicy-oven-baked-ribs/"}, "body": "## Ingredients\n- 500g pork loin\n- Salt and black pepper\n- BBQ SAUCE\n- 1 tablespoon olive oil\n- 1/4 cup finely diced onion\n- 1/2 teaspoon ground cumin\n- 1/2 cup ketchup\n- 1 tablespoon hot chili sauce\n- 2 tablespoons light brown sugar\n- 1 tablespoon apple cider vinegar (any sour liquid)\n- Salt and ground pepper, to taste\n\n## Steps\n1. Oven to 135C.\n2. Salt and pepper. Cover with alu foil. Bake meat size up for 3 hrs.\n3. Oil in pan over med heat. Add onions and cook until soft and translucent. Add cumin and cook for 30s. Add ketchup, chili sauce, sugar, and apple cider vinegar. Stir to combine, season with salt then cook for 2 minutes.\n4. Finish with broil the chops with sauce on both side in oven. Or cook in the pan for a while.\n", "slug": "pork-rib-with-bbq-sauce"}, {"frontmatter": {"title": "Pukka Yellow Curry", "categories": ["Curry"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": "http://www.jamieoliver.com/recipes/chicken-recipes/pukka-yellow-curry/#OuUFD2zxPUUIofi0.97"}, "body": "## Ingredients\n- 500g đùi gà\n- 1 onion (chia 2)\n- 2 garlic cloves\n- 2,5cm ginger\n- 2 bell peppers\n- 4 tsps chicken broth? (1 chicken stock cube)\n- 2 tsps hot paprika(1 red chili)\n- 8g cilantro\n- 1/2 tsp honey\n- 1/2 tsp turmeric\n- 1 tsp curry powder\n- olive oil\n- 250ml nước sôi\n- 200 g soft chickpeas\n- 2 tsp tomato puree\n\n## Steps\n1. Chuẩn bị tỏi, hàng, gừng và ớt ngọt\n2. Cho 4 thứ trên vào máy xay cùng chicken broth, coriander, honey, tumeric, curry powder, hot paprika\n3. Cho dầu vào chảo và rán gà tầm 10 phút / gà vàng 2 mặt\n4. Gắp gà vào đĩa khác và để chảo yên\n5. Cho phần hành và ớt ngọt lại vào chảo cùng paste và nấu khoảng 5 phút\n6. Đổ nước sôi vào chảo, sau đấy là bean cùng tomato puree. Cho 1 nhúm muối,đường nâu và tiêu vào và đảo.\n7. Cho gà lại vào chảo, đậy nắp, giảm nhiệt và đun tầm 45 phút cho đến khi sốt đặc lại\n", "slug": "pukka-yellow-curry"}, {"frontmatter": {"title": "Quick Sausage with Tomatoes", "categories": ["Pork"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://youtu.be/4QDw_VvC0AQ?t=363"}, "body": "## Ingredients\n- Cooking\n- 200g Sausage\n- Pasta\n- Onion\n- Cherry tomatoes\n- Salt n Pepper\n- Pasta cooking water\n- Add pasta to pan\n\n## Steps\n1. Cook pasta\n2. Cook onion till soft\n3. Cắt Sausage bé, cho vào nồi\n4. Meat brown, tomatoes & season vào\n5. Nước pasta vào nồi\n6. Drain pasta và cho mì vào nồi\n", "slug": "quick-sausage-with-tomatoes"}, {"frontmatter": {"title": "Roasted Pork Loin", "categories": ["Pork"], "prep_minutes": 60, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- Pork loin\n- Garlic\n- Rosmarin\n- Salt and pepper\n- Olive oil\n- White wine\n\n## Steps\n1. Preheat oven 175C\n2. Crush garlic, rosmary, salt and pepper together. Make a paste.\n3. Pierce meat and press paste in. Rub remainder with olive oil outside.\n4. Bake 1 hour.\n5. White wine the burn stuff.\n", "slug": "roasted-pork-loin"}, {"frontmatter": {"title": "Salibury Steak in Mushroom Gravy", "categories": ["Beef"], "prep_minutes": 4, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/90497/scrumptious-salisbury-steak-in-mushroom-gravy/="}, "body": "## Ingredients\n- 500g ground beef\n- 1 egg\n- 3 tablespoons crumbs\n- 2 tablespoons finely chopped onion\n- 1/2 teaspoon salt\n- 1/2 teaspoon pepper\n- 1/4 teaspoon poultry seasoning\n- approx 170g cans sliced mushrooms with juice\n- 3 tablespoons butter\n- 3 tablespoons all-purpose flour\n- 3 cups milk\n- 3 cubes beef bouillon\n\n## Steps\n1. mix together the ground beef, egg, cracker crumbs, onion, salt, pepper and poultry seasoning. Shape into 6 patties about 1 inch thick.\n2. Fry over medium-high heat for 3 to 4 minutes per side, or until browned. Drain off grease, and remove patties to a platter; keep warm.\n3. Melt butter, add mushrooms. Cook and stir for about 2 minutes. Sprinkle the flour over, and mix in until blended. Stir in the milk and beef bouillon. Cook and stir over medium heat until smooth and starting to thicken. Return the patties to the gravy and cook over low heat, uncovered, for 10 minutes, stirring occasionally.\n", "slug": "salibury-steak-in-mushroom-gravy"}, {"frontmatter": {"title": "Salisbury Steak", "categories": ["Beef"], "prep_minutes": 120, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/280901/chef-johns-salisbury-steak/"}, "body": "## Ingredients\n- For the Steaks:\n- 1 pound 85% lean ground beef\n- ½ tsp black pepper\n- 1 tsp dry mustard\n- 2 tbs ketchup\n- 1 tbs Worcestershire sauce\n- 1 tsp soy sauce\n- 1 large egg, beaten\n- 1 pinch cayenne pepper, or to taste\n- ½ cup plain bread crumbs\n- For the Gravy:\n- 2 tbs salted butter\n- 12 large white button mushrooms, sliced\n- 1 cup diced onion\n- 1 pinch salt\n- 2 tbs all-purpose flour\n- 2 tbs ketchup\n- 1 tbs Worcestershire sauce\n- 3 cups high-quality, low-sodium beef broth\n- salt to taste\n- 2 tbs salted butter\n\n## Steps\n1. Combine beef, black pepper, dry mustard, ketchup, Worcestershire, soy sauce, egg, cayenne, and bread crumbs in a bowl. Mix.\n2. Marinate for 2 hours, or overnight.\n3. Melt 2 tablespoons butter in a large nonstick pan over high heat; add mushrooms, onions, and a pinch of salt. Saute, stirring occasionally, until very nicely browned, 5 to 8 minutes.\n4. Reduce heat to medium and add flour. Cook and stir for 3 minutes.\n5. Stir in ketchup, Worcestershire sauce, and beef broth; increase heat to high.\n6. Bring to a simmer; reduce heat to medium and cook, stirring occasionally, until the gravy thickens slightly and reduces, about 10 minutes. Taste and adjust salt as needed. Transfer to bowl,  scraping the pan clean.\n7. Remove meat from the refrigerator and divide into 4 equal portions. Season both sides of the patties lightly with salt.\n8. Melt 2 tbs over medium-high heat. Add the patties and cook until browned, 2 to 3 minutes per side. Pour in gravy and bring to a simmer; reduce heat to medium and continue to cook until gravy is piping hot, and the meat is just cooked through and springs back lightly when touched, about 5 mins.\n", "slug": "salisbury-steak"}, {"frontmatter": {"title": "Salt vinegar dip", "categories": ["Uncategorized"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "http://www.thekitchn.com/"}, "body": "## Ingredients\n- 1/2 Cup mayo\n- 1/2 Cup sour cream\n- 2 tbs balasmaic\n- 1 tsp mustard\n- 1 tsp salt\n- Pepper\n- Sugar\n\n## Steps\n1. Plan\n2. Fit green mind: 04.11.24\n3. Adam Ragusea 05.01.26\n4. Chef John 18.04.24\n5. If I ever bake: Emojoie\n6. https://www.mrfood.com/\n7. Low Prio\n8. https://www.youtube.com/shorts/hinOzS_k_JA\n9. Fullchic\n10. https://www.thekitchn.com/cold-weather-recipe-white-chicken-chili-recipes-from-the-kitchn-181533\n11. Vegan\n12. https://www.allrecipes.com/recipe/83716/veggie-vegetarian-chili/\n13. https://www.instagram.com/p/CyjWosYqKlx/\n14. https://www.instagram.com/fitgreenmind/reel/DFa-UFmiluZ/\n15. https://www.allrecipes.com/recipe/8466000/chef-johns-mulligatawny-soup/\n16. BBQ Big meat\n17. https://www.youtube.com/watch?v=AH8S4yuaMLY\n18. Cheesy broiled sheet pan pasta with vegetables\n19. https://www.youtube.com/watch?v=XR0VKqfSHBk\n20. Vegan+cheese?\n21. https://www.youtube.com/watch?v=DkaYN0YljuM\n22. Shepherd's Pie in a cast iron pan\n23. https://www.youtube.com/watch?v=gAG3S55D9C4\n24. Pork tenderloin\n25. https://www.youtube.com/watch?v=DXYkeaiRSEw&t=390s\n26. Mongolian meatloaf\n27. https://www.youtube.com/watch?v=oIwo7USPMyw\n28. Chicken marbela\n29. https://www.youtube.com/watch?v=HIDkVmPqbU4\n30. Others\n31. Sauces\n32. https://www.youtube.com/watch?v=s-aMfgZhZZk\n33. Peanut sauce\n34. https://www.youtube.com/watch?v=fMqmdc7dR88\n35. Mousee\n36. https://www.thekitchn.com/blueberry-lemon-mousse-recipe-23653867\n37. https://www.youtube.com/watch?v=ubkdw9LCdzw\n38. Vegan\n39. VEGANES „MUTTON“ CURRY\n40. https://www.instagram.com/p/CyjWosYqKlx/\n41. POLOS CURRY\n42. https://www.instagra s": null, "image": null, "source_url": "http://allrecipes.com/recipe/24264/sloppy-joes-ii/?src=VD_Summary"}, "body": "## Ingredients\n- 500g thịt\n- 0,51 onion\n- 1 bell pepper\n- 0,5 tsp garlic powder\n- 1 tsp mustard\n- 0,75 cup ketchup\n- 3 tsp brown sugar\n- salt and pepper to taste\n\n## Steps\n1. Brown thịt tầm 3 phút ở medium-heat cho hành và ớt chuông vào cho đến khi thịt chín hẳn\n2. Cho mustard, ketchup, brown sugar, garlic powder\n3. Cho hành và muối thêm tuỳ thích\n", "slug": "sloppy-joes-ii"}, {"frontmatter": {"title": "Spiced Pork Chop (aight)", "categories": ["Pork"], "prep_minutes": 8, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 Pork loin\n- Sốt\n- (Chili Powder)\n- 3 tsp Paprika\n- 5-6 star anise\n- 2 tsp salt and pepper to taste\n- 1 tbs olive oil\n- thyme\n- 2 garlic, lightly smashed\n- 1 tsp coriander seeds\n\n## Steps\n1. Cho tất cả các sốt vào 1 đĩa\n2. Chộn đều rồi phết đều lên 2 mặt thịt\n3. Cho vào tủ lạnh vài tiếng\n4. Oven 200C\n5. Olive oil\n6. Rán lửa (med high), nâu 2 mặt\n7. Cho vào lò 8-10 phút.\n", "slug": "spiced-pork-chop-aight"}, {"frontmatter": {"title": "Spicy baked salad", "categories": ["Salad"], "prep_minutes": 25, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 cups cherry tomatoes\n- 1000 ml chickpeas\n- 15 sliced thin garlic\n- 1/4 cups fresh oregano (1 tbs dried)\n- 1 tbs honey\n- 2 strips of lemon peel\n- dash of red chilli flakes\n- 1/4 cup extra virgin olive oil\n- 1 tsp salt\n- 1 tsp pepper\n- (240 ml feta cut into 4 thinner blocks)\n- garnish with fresh oregano or basil\n\n## Steps\n1. All together in oven for 25 mins 175C\n2. (Add cheese block\n3. Broil a little bit\n4. Mix together again)\n5. Garnish wit hot honey and greens\n", "slug": "spicy-baked-salad"}, {"frontmatter": {"title": "Spicy Sausage Rice", "categories": ["Pork"], "prep_minutes": 12, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=FP6E3JtmsCE"}, "body": "## Ingredients\n- 200g Sausage\n- Chicken stock\n- Hành\n- 1 Bell pepper\n- 2 garlic cloves\n- Rice\n- White wine\n- Spring onion\n- Parsly\n- 1 Tomatoe\n\n## Steps\n1. Cắt sausage thành nhiều miếng bé\n2. Cắt hành và rán 7/10 Heat\n3. Căt pepper bé và cho vào nồi\n4. Garlic cắt bé và cho vào nồi\n5. 10/10 Heat\n6. Makes a wheel in the center\n7. Xúc xích vào và rán\n8. White wine deglaze\n9. Chicken stock to rise\n10. 12-15 mins stir\n11. Spring onions, parsly và tomato vào\n", "slug": "spicy-sausage-rice"}, {"frontmatter": {"title": "Steak and potato pie", "categories": ["Beef"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=0a4LDU0pwuU"}, "body": "## Ingredients\n- 1kg fillet steak\n- Veggies:\n- 4 medium carrots\n- 3 stalks celery\n- 5-6 green onions\n- Sauce:\n- 1-2 tsp soy sauce or a stock beef cube\n- 1-2 tsp pepper\n- 3-4 tbsp honey or sugar\n- Cover:\n- 3 cloves garlic\n- 500g potatoes\n- 1 egg yolk\n- 1-2 tbsp cornstarch (or flour)\n- 2 tbsp vegetable oil\n- 1-2 tbsp tomato paste\n- 1 cup white wine (or red wine or broth)\n- 2 packets unflavored gelatin\n- 1-2 tbsp cornstarch\n- 1/4 cup cream, divided\n\n## Steps\n1. Oven 180°C\n2. Cut steak against the grain into large pieces. Salt & pepper the steak, then toss in cornstarch or flour\n3. Heat vegetable oil to very hot, then brown the steak on all sides. The inside should be undercooked at this stage. Remove the meat and set aside\n4. Slice the veggies thinly. Sautee for 2-3 minutes, then add the tomato paste and sautee for 30 more seconds\n5. Deglaze with wine. Scrape up the fond. Let simmer until veggies are soft.\n6. Bloom the gelatin in 1/2 cup of cool water. Make a slurry with the cornstarch. Add the cornstarch slurry to the pan and stir to thicken, then add additional wine until vegetables are covered.\n7. Add the sauce, and gelatin. Turn the heat to low and stir to combine.\n8. Mince the garlic and slice the potatoes very thinly\n9. Add the meat and vegetables to a baking vessel, then add the egg yolk. Stir to combine, then smooth the top\n10. Lay on a layer of potatoes, then garlic, salt, & pepper, then a splash of cream.\n11. Cook covered for 45 minutes, then uncover and brown for an additional 45 minutes, until potatoes are done to your liking.\n12. Let cool for 10 minutes\n13. SAUSAGE:\n", "slug": "steak-and-potato-pie"}, {"frontmatter": {"title": "Steak Diane Ragusea", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=J2RbSZob6ag"}, "body": "## Ingredients\n- 200g sirloin steak\n- 1 onion\n- 200g mushrooms, minced\n- 4 garlic cloves, minced\n- 1 -2 tbs Worcestershire sauce\n- 1 tbs (Dijon) mustard\n- 1 tbs tomato paste\n- 125ml heavy cream\n- 1 cup rind broth\n- (cognac or brown liquor)\n- Lemon juice\n- (Small handful of flat-leaf parsley)\n\n## Steps\n1. Season with salt, pepper and oil.\n2. Brown both side in med high heat. Meat should be a bit red inside. Then set aside.\n3. Add mushroom. When mushroom’s color turns brown, add onion, garlic and tomato paste.\n4. When everything in pan is brown, deglaze with broth or liquor.\n5. When the pan is dry down, add broth, mustard, Worchestershire sauce.\n6. Cook until the liquid reduces down to a good amount. Add the meat back, crème and lemon juice until the sauce thicken.\n", "slug": "steak-diane-ragusea"}, {"frontmatter": {"title": "Steak Diane", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=9rWZNHkrsNg&list=PLTzMGnJjrsSzcZUHSAlKD0JTeOLl95rEM&index=4"}, "body": "## Ingredients\n- 200g sirloin steak\n- 3 shallots, peeled\n- 200g mushrooms\n- 1 tbs salted butter\n- 1 garlic clove, peeled\n- 1 -2 tbs Worcestershire sauce\n- 1 tbs Dijon mustard\n- 1/3 cup brandy or cognac\n- 1 cup heavy cream\n- Small handful of flat-leaf parsley\n\n## Steps\n1. Roll flat the steak and season.\n2. Brown both side in med high heat. Then set  aside.\n3. Add shallot and season. Cook to soft.\n4. Add mushroom, butter, and crushed garlic.\n5. Add wochester sauce and mustard.\n6. Add alcohol.\n7. When alcohol is burnt off, add heavy cream and parsley.\n", "slug": "steak-diane"}, {"frontmatter": {"title": "Steak Dry Rub", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 3 tsps muối\n- 2 tsps smoked paprika\n- 2 tsps onion powder\n- 2 tsps garlic powder\n- 2 tsps dried oregano\n- 2 tsps ground black pepper\n- 1 tsp brown sugar\n- 1 tsp cumin\n\n## Steps\n1. Mix well\n", "slug": "steak-dry-rub"}, {"frontmatter": {"title": "Sticky Oven Barbecue Ribs", "categories": ["Pork"], "prep_minutes": 120, "cook_minutes": null, "image": null, "source_url": "https://cafedelites.com/oven-barbecue-ribs/"}, "body": "## Ingredients\n- RIBS:\n- 500g back pork ribs\n- MIX:\n- 1 tsp garlic powder\n- 1 tsp onion powder\n- 1 tsp paprika\n- Salt and pepper\n- 1 tbs cumin\n- 1 tsp chili\n- (2 tbs olive oil)\n- (1/2 tbs sugar)\n- SAUCE:\n- (150ml) barbecue sauce\n- 1 tsp minced garlic\n- 1 tbs olive oil\n- 1 tsp Worcestershire sauce\n- 1 tsp salt\n- (1 tsp dry mustard)\n- (1 tsp hot pepper)\n\n## Steps\n1. Preheat oven to (130-150C).\n2. (Make hole backside of rib)\n3. Combine MIX. Season both side. Cover tray with foil and bake for 2-3 hours.\n4. During the last 5 minutes of cook time, mix SAUCE ingredients.\n5. Remove ribs from the oven, remove foil and spread the tops of the ribs with the barbecue sauce mixture.\n6. Increase oven temperature to 200-220°C. Return ribs to the oven, uncovered, and bake for a further 10 minutes. Oven settings: broil or grill on medium-high heat for about 3 minutes.\n7. Rest for 10 minutes\n8. Hoisin Stick Rib: Not that good\n9. https://www.inspiredtaste.net/57960/hoisin-sticky-ribs/\n", "slug": "sticky-oven-barbecue-ribs"}, {"frontmatter": {"title": "Sticky Pork Ribs", "categories": ["Pork"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": "https://youtu.be/KgOBAWbkq5Q?t=25"}, "body": "## Ingredients\n- 500g pork chop\n- Salt and black pepper\n- Dried:\n- Ginger, sliced\n- 4 cloves garlic, sliced\n- Hot pepper\n- (Pepper corn)\n- Cumin or staronni\n- Wet:\n- Honey\n- Soy sauce\n- Hot sauce\n- Vinegar or Ketchup\n- (Rice Wine or Dried Cherry)\n- Rind or Veg Broth\n\n## Steps\n1. Oven to 185C.\n2. Salt and pepper. Med high heat, brown both side.\n3. Dried spices in. 1 min.\n4. Wet ingredients in.\n5. Stock in, barely cover ribs.\n6. In oven 30 mins. Turn and cook for another 30 mins.\n7. Chicken - Generic\n", "slug": "sticky-pork-ribs"}, {"frontmatter": {"title": "Swedish Meatballs", "categories": ["Beef"], "prep_minutes": 60, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- Thịt:\n- 500 g thịt\n- 2 trứng\n- 1/2 củ hành tây to cắt thành hạt\n- 8 tbs breadcrumb\n- 0,5 tbs muối\n- 1 tbs tiêu\n- (- 70ml sữa)\n- % Butter\n- 1/2 tbs nutmeg\n- (- nhúm cayanne pepper)\n- Sốt:\n- 3 tbs butter\n- 1 tbs (all purpose) flour\n- 3 Cups beef broth\n- 3/4 cup Heavycream\n- 0,5 tbs đường\n- ( 1/4 tbs Worcestershire sauce)\n- % muối và tiêu\n- 2 nhánh hành lá\n\n## Steps\n1. Bơ tan và hành tây đảo đến khi nhừ\n2. Cho vào 1 bát to + sữa + trứng + breadcrumb, muối + tiêu + nutmeg + cayanne pepper\n3. Mix đều rồi cho thịt vào bát trộn đều\n4. Cho vào tủ lạnh tầm 1h\n5. Nấu beef broth\n6. Bơ tan và flour vào chảo tầm 4 phút hoặc chuyển màu nâu vàng\n7. Cho từ từ beef broth vô\n8. Lửa lên med-high\n9. Cho heavycream vô\n10. Nấu cho đến hơi sệt lại rồi tắt\n11. Viên thịt cho lên giấy bạc\n12. Cho vào lò: 20 phút 220 C ( hoặc thịt nâu)\n13. Rồi cho thịt vào sốt simmer.\n14. Cho hành lá vào trước lúc ăn 2-3 phút.\n", "slug": "swedish-meatballs"}, {"frontmatter": {"title": "Sweet, Sticky and Spicy Chicken (Bad)", "categories": ["Chicken"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": "http://allrecipes.com/video/4203/sweet-sticky-and-spicy-chicken/"}, "body": "## Ingredients\n- 1 chicken breast\n- MIX:\n- Brown sugar\n- Honey\n- Soy sauce\n- Ginger\n- Garlic\n- Hot sauce\n\n## Steps\n1. Combine MIX.\n2. Lightly salt and pepper the chicken strips.\n3. Medium heat. Add chicken strips and brown on both sides.\n4. Pour the sauce over the chicken. Simmer uncovered until the sauce thickens, 8 to 10 minutes.\n", "slug": "sweet-sticky-and-spicy-chicken-bad"}, {"frontmatter": {"title": "Tofu Dubu Jorim", "categories": ["Vegetables"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/CzZhTt9Ktnx/"}, "body": "## Ingredients\n- 400g tofu\n- 3 cloves garlic\n- 2 spring onion\n- 1 Tbsp chili flakes\n- 1 Tbsp sesame oil\n- 1/4 cup (60ml) soy sauce\n- 1/4 cup (60ml) water\n- 2 Tbsp syrup or sugar\n\n## Steps\n1. Pat tofu dry, cut in thick slices and fry in oil on both sides.\n2. Onion and garlic, finely chop.\n3. Mix spices and add the sauce to the tofu.\n4. Let it simmer for 5-10mins.\n", "slug": "tofu-dubu-jorim"}, {"frontmatter": {"title": "Tomato Sauce", "categories": ["Sauce"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- Shallot\n- Garlic\n- Tomato paste\n- (Can) Tomatoe\n\n## Steps\n1. Fry shallot, garlic and tomato paste. Salt, pepper\n2. Add (can) crushed tomatoe and a glug of white wine.\n3. Stir often\n", "slug": "tomato-sauce"}, {"frontmatter": {"title": "Tuna Casserol", "categories": ["Seafood"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/151593/campbells-tuna-noodle-casserole/"}, "body": "## Ingredients\n- 4 cups medium egg noodles\n- 300 ml Mushroom Soup: Knorr Pils Suppe + Kondesnmilch: Ratio 2/1\n- 300mg cans tuna, drained\n- 2 cups frozen peas\n- 1 cup milk\n- 2 tbs dry bread crumbs\n- 1 tbs butter, melted\n\n## Steps\n1. Preheat the oven to 200C.\n2. Stir noodles hili", "categories": ["Rice & Noodles"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/83716/veggie-vegetarian-chili/"}, "body": "## Ingredients\n- 1 cup chopped onion\n- 1 cup chopped carrots\n- 3 cloves garlic, minced\n- 3 bell peppers\n- 2 tbs chili powder\n- 800 ml can whole peeled tomatoes\n- 400 ml can black beans, drained\n- 400 ml can kidney beans, drained\n- 400 ml can pinto beans, drained\n- 400 ml can whole kernel corn, drained\n- 1 ½ cups chopped fresh mushrooms\n- 1 ½ tbs dried oregano\n- 1 ½ tbs dried basil\n- 1 tbs ground cumin\n- ½ tbs garlic powder\n\n## Steps\n1. Large pot, medium heat.\n2. Add onion, carrots, and garlic; cook and stir until tender.\n3. Stir in bell peppers; season with chili powder. Cook until peppers are tender, about 5 minutes.\n4. Stir in tomatoes, black beans, kidney beans, pinto beans, corn, and mushrooms; season with oregano, basil, cumin, and garlic powder.\n5. Bring to a boil.\n6. Reduce heat to medium, cover, and cook 20 minutes, stirring occasionally.\n", "slug": "veggie-vegetarian-chili"}, {"frontmatter": {"title": "Vichyssoise", "categories": ["Uncategorized"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/13392/classic-vichyssoise/"}, "body": "## Ingredients\n- 1 tbs butter\n- 3 (250g) leeks, sliced into rings\n- 1 onion, sliced\n- 5 medium (600g) potatoes, peeled and thinly sliced\n- salt and pepper to taste\n- ½ tsp dried marjoram\n- ¼ tsp dried thyme\n- 1 bay leaf\n- 5 cups chicken broth\n- ¼ cup heavy whipping cream\n- Garnish with Parsley\n\n## Steps\n1. Butter with low heat.\n2. Add leeks and onion; cover and cook for 10 minutes.\n3. Stir in potatoes; season with salt and pepper. Add marjoram, thyme, and bay leaf; stir well. Cover and cook for 12 minutes.\n4. Pour in chicken broth. Bring to a boil, reduce heat, and cook, partially covered, for 30 minutes.\n5. Purée soup in a blender. Allow to cool to room temperature, then stir in cream.\n6. Potato Soup\n7. https://www.allrecipes.com/recipe/13218/absolutely-ultimate-potato-soup/\n8. 500g chopped bacon/grounded meat\n9. 2 stalks celery, diced\n10. 1 onion, chopped\n11. 3 cloves garlic, minced\n12. 1,4 kg potatoes, peeled and cubed\n13. 4 cups chicken stock, or enough to cover potatoes\n14. 45g butter\n15. 30g all-purpose flour\n16. 1 cup heavy cream\n17. 1 tsp dried tarragon\n18. 3 tsp chopped fresh cilantro\n19. Brown the meat. Set aside. If bacon, drain off all but 1/4 cup of the bacon grease.\n20. Cook celery and onion in the reserved bacon drippings until soft and translucent, about 5 minutes. Stir in garlic, and continue cooking for 1 to 2 minutes.\n21. Add cubed potatoes, and toss to coat. Sauté for 3 to 4 minutes. Return bacon to the pan, and add enough chicken stock to just cover the potatoes. Cover, and simmer until potatoes are tender, 15 to 20 minutes.\n22. In a separate skillet makes a roux. Whisk in heavy cream, tarragon, and cilantro.\n23. Bring cream mixture to a boil, and cook, stirring constantly, until thickened, about 5 minutes. Add cream mixture to the potato mixture; stir to combine.\n24. Transfer about 1/2 of the soup to a blender and purée. Return to the pot. Adjust seasonings to taste.\n", "slug": "vichyssoise"}, {"frontmatter": {"title": "Vietnamese beef stew", "categories": ["Beef"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": "https://www.vickypham.com/blog/vietnamese-beef-stew-bo-kho"}, "body": "## Ingredients\n- Beef Marinade:\n- 1 kg beef goulash\n- 1 tsp red curry powder\n- 1 tsp sea salt\n- 1 tbs sugar\n- 1 tbs chicken bouillon powder\n- 2 tbs garlic (minced)\n- 2 tbs shallots (minced)\n- 4 large carrots\n- 2 large lemongrass\n- 2-inch knob ginger\n- 2 tablespoons oil\n- 200g tomato paste\n- 400ml coconut juice\n- 1 cinnamon stick\n- 3 whole star anise\n- 1 tbs fish sauce\n- ½ tablespoon light soy sauce\n\n## Steps\n1. Marinate beef cube for at 30 minutes to overnight\n2. Cut carrot into the same size as the beef.\n3. Discard the lemongrass leafy tops, if any.\n4. Cut the lemongrass stalk into 4\" segments.\n5. Slice the ginger into thick coins\n6. Brown beef in med-high.\n7. Clear the center.\n8. Add the lemongrass and ginger.\n9. Pan fry for about one minute.\n10. Stir in tomato paste.\n11. Add coconut soda, and water.\n12. Braise with the lid on for 1-½ hours on very low heat.\n13. Add carrots, cinnamon stick and whole star anise. Continue cooking with a covered lid on a low simmer for about 30 minutes.\n", "slug": "vietnamese-beef-stew"}, {"frontmatter": {"title": "WHOLE ROASTED CAULIFLOWER", "categories": ["Vegetables"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/CzZhTt9Ktnx/"}, "body": "## Ingredients\n- 1 Blumenkohl\n- ca. 60ml Olivenöl\n- eine gute Prise Salz\n- 3 gute EL Tahini\n- Sauce:\n- 1 El Ahornsirup\n- 1 Tl Sriracha (optional)\n- Saft einer Limette\n- Salz nach Geschmack\n- Wasser zum Verdünnen\n\n## Steps\n1. Blumenkohl in gesalzenem Wasser 5-10 min kochen\n2. Den Blumenkohl mit Öl übergießen und Salzen.\n3. Bei 225C 45min backen\n4. Rest 5min\n5. Mixen und mit dem Blumenkohl servieren.\n", "slug": "whole-roasted-cauliflower"}, {"frontmatter": {"title": "Wine Glazed Chicken", "categories": ["Chicken"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g gà\n- 1 teaspoon salt\n- (-1/2 tsp ground nutmeg)cinnamon\n- 1/4 cup butter\n- 4/3 cups dry white wine\n- 1 cup sliced fresh mushrooms\n- 1 red bell pepper, thinly sliced\n- 3 scallions, chopped\n- 1/4 cup chicken broth\n- 4 teaspoons cornstarch\n\n## Steps\n1. Cho muối và cinnamon lên gà, cắt nấm và ớt ngọt\n2. Nấu tan bơ trong một nồi medium high heat. Brown both side. Lật thịt thường xuyên\n3. Cho rượu, nấm, ớt ngọt và hành vào và đun sôi ở medium heat. Đậy nắp đun medium low cho đến khi thịt chín. Bỏ thịt ra khỏi nồi.\n4. Cho hỗn hợp chicken broth và cornstach vào và nấu khoảng 1 phút\n", "slug": "wine-glazed-chicken"}, {"frontmatter": {"title": "Zucchini Soup", "categories": ["Vegetables"], "prep_minutes": 8, "cook_minutes": null, "image": null, "source_url": "https://www.foodandwine.com/recipes/silky-zucchini-soup"}, "body": "## Ingredients\n- 1 tbs unsalted butter\n- 2 tbs extra-virgin olive oil\n- 1 small onion, finely chopped\n- 5 garlic clove, thinly sliced\n- 700g zucchini, halved lengthwise and sliced 1/4-inch thick\n- 2/3 cup vegetable stock or low-sodium broth\n\n## Steps\n1. Moderately low heat, melt the butter in the olive oil.\n2. Add the onion and garlic, season with salt and pepper, and, stirring frequently, until softened, 7 to 8 minutes.\n3. Add the zucchini until softened, about 10 minutes.\n4. Add the stock and 1 1/2 cups of water and bring to a simmer; cook until the zucchini is very soft, about 10 minutes.\n5. Puree the soup in a blender.\n", "slug": "zucchini-soup"}];
// Cooking app — single-page vanilla JS.
// State lives in memory; the API (or baked data in static build) is the source of truth.

(() => {
  "use strict";

  // ----- data source -----

  // When built into a single self-contained recipes.html, build.py replaces the
  // line below with: const BAKED = [...]; otherwise BAKED is null and we fetch.
  const BAKED = (typeof __BAKED_RECIPES__ !== "undefined") ? __BAKED_RECIPES__ : null;
  const STATIC_MODE = Array.isArray(BAKED);

  /** Returns Promise<RecipeRecord[]> */
  async function loadRecipes() {
    if (STATIC_MODE) return BAKED.slice();
    const r = await fetch("/api/recipes");
    if (!r.ok) throw new Error("failed to load recipes");
    return r.json();
  }

  async function saveRecipe(rec, mode /* "create" | "update" */) {
    if (STATIC_MODE) throw new Error("Read-only mode (no server)");
    const url = mode === "update"
      ? `/api/recipes/${encodeURIComponent(rec.slug)}`
      : "/api/recipes";
    const method = mode === "update" ? "PUT" : "POST";
    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(rec),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `save failed (${r.status})`);
    return body;
  }

  async function deleteRecipe(slug) {
    if (STATIC_MODE) throw new Error("Read-only mode (no server)");
    const r = await fetch(`/api/recipes/${encodeURIComponent(slug)}`, { method: "DELETE" });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || `delete failed (${r.status})`);
    }
  }

  async function uploadImage(file, slug) {
    if (STATIC_MODE) throw new Error("Read-only mode (no server)");
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || [".jpg"])[0].toLowerCase();
    const safeSlug = slug.replace(/[^a-zA-Z0-9_-]/g, "");
    const filename = `${safeSlug || "image"}-${Date.now()}${ext}`;
    const data = await file.arrayBuffer();
    const b64 = bytesToBase64(new Uint8Array(data));
    const r = await fetch("/api/images", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename, data_base64: b64 }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `upload failed (${r.status})`);
    return body.filename;
  }

  function bytesToBase64(bytes) {
    let s = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  // ----- imperial -> metric conversion -----
  //
  // Applied on save (create or edit). Inline format: keep the original text,
  // append metric in parentheses. tsp/tbs are intentionally left alone.

  // Per-cup weights (grams) for common ingredients. Liquids are in mL.
  // Source: the conversion table at the top of Cooking.docx.
  const CUP_GRAMS = {
    flour: 120, "all-purpose flour": 120, "ap flour": 120,
    sugar: 200, "brown sugar": 220, "powdered sugar": 120,
    butter: 227, "cocoa": 85, "cocoa powder": 85,
    salt: 288, honey: 340, "baking powder": 192, "baking soda": 220,
    oat: 90, oats: 90, rice: 185,
  };
  const CUP_ML = {
    water: 237, milk: 240, "almond milk": 240, "coconut milk": 240,
    cream: 240, "heavy cream": 240, "sour cream": 240,
    broth: 240, stock: 240, juice: 240, vinegar: 240,
    oil: 218, "olive oil": 218, "vegetable oil": 218,
    syrup: 320, "maple syrup": 320,
    yogurt: 245, "greek yogurt": 245,
    sữa: 240, nước: 237,
  };

  function parseQty(s) {
    s = s.trim().replace(",", ".");
    // mixed numeral like "1 1/2"
    let m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) return Number(m[1]) + Number(m[2]) / Number(m[3]);
    m = s.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (m) return Number(m[1]) / Number(m[2]);
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function fmtNum(n) {
    if (n >= 100) return String(Math.round(n));
    if (n >= 10) return String(Math.round(n));
    return n.toFixed(1).replace(/\.0$/, "");
  }

  function pickCupConversion(rest) {
    const r = rest.toLowerCase();
    // longest keyword first
    const keys = Object.keys({ ...CUP_GRAMS, ...CUP_ML }).sort((a, b) => b.length - a.length);
    for (const k of keys) {
      const re = new RegExp(`\\b${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
      if (re.test(r)) {
        if (k in CUP_ML) return { unit: "ml", per: CUP_ML[k] };
        return { unit: "g", per: CUP_GRAMS[k] };
      }
    }
    return { unit: "ml", per: 237 }; // default to volume
  }

  // Each entry: { re, replace(match) => string }
  // Conversion REPLACES the imperial portion with metric (does not keep both).
  const CONVERTERS = [
    // °F or 350F  ->  °C  ("350°F" -> "177 °C")
    {
      re: /(\d+(?:[.,]\d+)?)\s*°?\s*F\b/g,
      replace: (m, q) => {
        const f = parseQty(q); if (f == null) return m;
        const c = Math.round(((f - 32) * 5) / 9);
        return `${c} °C`;
      },
    },
    // oz  ->  g  ("3 oz cream cheese" -> "85 g cream cheese")
    {
      re: /(\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?(?:\s+\d+\s*\/\s*\d+)?|\d+\s*\/\s*\d+)\s*oz\b/gi,
      replace: (m, q) => {
        const n = parseQty(q.split(/\s*-\s*/)[0]); if (n == null) return m;
        return `${fmtNum(n * 28.35)} g`;
      },
    },
    // lb / lbs / pound / pounds  ->  g
    {
      re: /(\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?(?:\s+\d+\s*\/\s*\d+)?|\d+\s*\/\s*\d+)\s*(?:lbs?|pounds?)\b/gi,
      replace: (m, q) => {
        const n = parseQty(q.split(/\s*-\s*/)[0]); if (n == null) return m;
        return `${fmtNum(n * 453.6)} g`;
      },
    },
    // cup / cups  ->  keep original, append metric in parens
    //   "1 cup of milk"   -> "1 cup (240 ml) of milk"
    //   "2 cups flour"    -> "2 cups (240 g) flour"
    {
      re: /(\d+(?:[.,]\d+)?(?:\s+\d+\s*\/\s*\d+)?|\d+\s*\/\s*\d+)\s*cups?\b/gi,
      replace: (m, q, offset, full) => {
        const n = parseQty(q); if (n == null) return m;
        const rest = full.slice(offset + m.length);
        // Skip if already annotated: " (240 ml)" or " (240 g)"
        if (/^\s*\(\s*\d+(?:[.,]\d+)?\s*(?:ml|g)\b/i.test(rest)) return m;
        const { unit, per } = pickCupConversion(rest);
        return `${m} (${fmtNum(n * per)} ${unit})`;
      },
    },
  ];

  function convertImperialLine(line) {
    if (!line) return line;
    let out = line;
    for (const { re, replace } of CONVERTERS) {
      out = out.replace(re, replace);
    }
    return out;
  }

  function convertImperialList(lines) {
    return (lines || []).map(convertImperialLine);
  }

  // ----- markdown body parsing -----

  /** Pull "## Ingredients" / "## Steps" / leftover from the body text. */
  function parseBody(body) {
    const sections = { ingredients: [], steps: [], notes: [] };
    let current = "notes";
    for (const raw of (body || "").split(/\r?\n/)) {
      const line = raw.trim();
      if (/^##\s+ingredients\b/i.test(line)) { current = "ingredients"; continue; }
      if (/^##\s+steps\b/i.test(line)) { current = "steps"; continue; }
      if (/^##\s+notes\b/i.test(line)) { current = "notes"; continue; }
      if (!line) continue;
      const cleaned = line.replace(/^[-*]\s+/, "").replace(/^\d+\.\s+/, "");
      sections[current].push(cleaned);
    }
    return sections;
  }

  function buildBody({ ingredients, steps, notes }) {
    const parts = [];
    parts.push("## Ingredients");
    if (ingredients.length) {
      for (const i of ingredients) parts.push(`- ${i}`);
    } else {
      parts.push("- ");
    }
    parts.push("");
    parts.push("## Steps");
    if (steps.length) {
      steps.forEach((s, i) => parts.push(`${i + 1}. ${s}`));
    } else {
      parts.push("1. ");
    }
    if (notes && notes.length) {
      parts.push("");
      parts.push("## Notes");
      for (const n of notes) parts.push(n);
    }
    return parts.join("\n") + "\n";
  }

  // ----- state + view glue -----

  const state = {
    recipes: [],
    query: "",
    category: "",
    showImages: false,
    view: "flat", // "flat" | "grouped"
    collapsed: new Set(), // category names collapsed in grouped view
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const main = $("#main");

  function categoriesOf(rec) {
    const cs = rec.frontmatter?.categories;
    if (!Array.isArray(cs)) return [];
    return cs.filter((c) => typeof c === "string" && c.trim()).map((c) => c.trim());
  }

  function allCategories() {
    const seen = new Set();
    for (const r of state.recipes) {
      for (const c of categoriesOf(r)) seen.add(c);
    }
    return Array.from(seen).sort((a, b) => a.localeCompare(b));
  }

  function refreshCategoryFilter() {
    const select = $("#category-filter");
    const cats = allCategories();
    const current = state.category;
    select.innerHTML = '<option value="">All categories</option>' +
      cats.map((c) => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join("");
    select.value = current;
  }

  function filteredRecipes() {
    const q = state.query.trim().toLowerCase();
    return state.recipes.filter((r) => {
      if (state.category) {
        const cats = categoriesOf(r);
        if (!cats.includes(state.category)) return false;
      }
      if (q) {
        const hay = (
          (r.frontmatter?.title || "") + "\n" +
          (r.body || "") + "\n" +
          categoriesOf(r).join(" ")
        ).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  // ----- views -----

  function makeCard(r) {
    const node = $("#tpl-card").content.firstElementChild.cloneNode(true);
    $(".title", node).textContent = r.frontmatter?.title || r.slug;
    $(".meta", node).textContent = metaLine(r);
    const img = $(".thumb", node);
    const imgName = r.frontmatter?.image;
    if (typeof imgName === "string" && imgName) {
      img.src = `recipe_images/${encodeURIComponent(imgName)}`;
      img.alt = r.frontmatter?.title || "";
    }
    node.href = `#/r/${r.slug}`;
    return node;
  }

  function makeGrid(recipes) {
    const grid = document.createElement("div");
    grid.className = "cards";
    for (const r of recipes) grid.appendChild(makeCard(r));
    return grid;
  }

  // Total active time in minutes, e.g. "45 min" (omitted when unknown).
  function timeLabel(r) {
    const prep = r.frontmatter?.prep_minutes;
    const cook = r.frontmatter?.cook_minutes;
    let total = 0;
    if (Number.isFinite(prep)) total += prep;
    if (Number.isFinite(cook)) total += cook;
    return total > 0 ? `${total} min` : "";
  }

  // Compact one-line row used inside category groups: "Name - Time".
  // The category is omitted (it is the group heading).
  function makeLine(r) {
    const a = document.createElement("a");
    a.className = "recipe-line";
    a.href = `#/r/${r.slug}`;
    const name = document.createElement("span");
    name.className = "recipe-line-name";
    name.textContent = r.frontmatter?.title || r.slug;
    const time = document.createElement("span");
    time.className = "recipe-line-time";
    time.textContent = timeLabel(r);
    a.appendChild(name);
    a.appendChild(time);
    return a;
  }

  function makeLineList(recipes) {
    const list = document.createElement("div");
    list.className = "recipe-lines";
    for (const r of recipes) list.appendChild(makeLine(r));
    return list;
  }

  function emptyMessage() {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = state.recipes.length ? "No recipes match the current filter." : "No recipes yet.";
    return p;
  }

  function showList() {
    if (state.view === "grouped") return showGrouped();
    const recipes = filteredRecipes();
    main.innerHTML = "";
    if (!recipes.length) { main.appendChild(emptyMessage()); return; }
    main.appendChild(makeGrid(recipes));
  }

  // Grouped view: one section per category, recipes listed under each. A recipe
  // with multiple categories appears under each; uncategorized ones go last.
  const UNCATEGORIZED = "Uncategorized";

  function showGrouped() {
    const recipes = filteredRecipes();
    main.innerHTML = "";
    if (!recipes.length) { main.appendChild(emptyMessage()); return; }

    const groups = new Map();
    for (const r of recipes) {
      const cats = categoriesOf(r);
      const keys = cats.length ? cats : [UNCATEGORIZED];
      for (const c of keys) {
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(r);
      }
    }

    const names = Array.from(groups.keys()).sort((a, b) => {
      if (a === UNCATEGORIZED) return 1;
      if (b === UNCATEGORIZED) return -1;
      return a.localeCompare(b);
    });

    for (const name of names) {
      const items = groups.get(name);
      const section = document.createElement("section");
      section.className = "category-group";
      if (state.collapsed.has(name)) section.classList.add("collapsed");

      const h = document.createElement("button");
      h.className = "category-heading";
      h.type = "button";
      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "category-name";
      label.textContent = name;
      const count = document.createElement("span");
      count.className = "category-count";
      count.textContent = items.length;
      h.append(chevron, label, count);
      h.addEventListener("click", () => {
        if (state.collapsed.has(name)) state.collapsed.delete(name);
        else state.collapsed.add(name);
        section.classList.toggle("collapsed");
        updateCollapseAllBtn();
      });

      section.appendChild(h);
      section.appendChild(makeLineList(items));
      main.appendChild(section);
    }
    updateCollapseAllBtn();
  }

  // Names of the category groups currently shown (mirrors showGrouped's keys).
  function currentGroupNames() {
    const names = new Set();
    for (const r of filteredRecipes()) {
      const cats = categoriesOf(r);
      if (cats.length) cats.forEach((c) => names.add(c));
      else names.add(UNCATEGORIZED);
    }
    return Array.from(names);
  }

  // The collapse-all button only matters in grouped view; its label reflects
  // whether the next click will collapse everything or expand everything.
  function updateCollapseAllBtn() {
    const btn = $("#toggle-collapse");
    if (!btn) return;
    if (state.view !== "grouped") { btn.hidden = true; return; }
    const names = currentGroupNames();
    btn.hidden = names.length === 0;
    const allCollapsed = names.length > 0 && names.every((n) => state.collapsed.has(n));
    btn.textContent = allCollapsed ? "Expand all" : "Collapse all";
    btn.dataset.state = allCollapsed ? "collapsed" : "expanded";
  }

  function metaLine(r) {
    const cats = categoriesOf(r).join(", ");
    const prep = r.frontmatter?.prep_minutes;
    const cook = r.frontmatter?.cook_minutes;
    const bits = [];
    if (cats) bits.push(cats);
    if (Number.isFinite(prep)) bits.push(`Prep ${prep} min`);
    if (Number.isFinite(cook)) bits.push(`Cook ${cook} min`);
    return bits.join(" · ");
  }

  function showDetail(slug) {
    const r = state.recipes.find((x) => x.slug === slug);
    if (!r) { main.innerHTML = '<p class="empty">Recipe not found.</p>'; return; }
    const node = $("#tpl-detail").content.firstElementChild.cloneNode(true);
    $(".title", node).textContent = r.frontmatter?.title || r.slug;
    $(".meta", node).textContent = metaLine(r);
    const img = $(".hero", node);
    const imgName = r.frontmatter?.image;
    if (typeof imgName === "string" && imgName) {
      img.src = `recipe_images/${encodeURIComponent(imgName)}`;
      img.alt = r.frontmatter?.title || "";
    }
    const { ingredients, steps } = parseBody(r.body);
    const ul = $(".ingredients ul", node);
    for (const i of ingredients) {
      const li = document.createElement("li");
      li.textContent = i;
      ul.appendChild(li);
    }
    const ol = $(".steps ol", node);
    for (const s of steps) {
      const li = document.createElement("li");
      li.textContent = s;
      ol.appendChild(li);
    }
    const src = r.frontmatter?.source_url;
    if (typeof src === "string" && src) {
      const p = $(".source", node);
      p.innerHTML = "Source: ";
      const a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = src;
      p.appendChild(a);
    }
    $(".back", node).addEventListener("click", () => history.back());
    $(".edit", node).addEventListener("click", () => { location.hash = `#/edit/${r.slug}`; });
    $(".delete", node).addEventListener("click", async () => {
      if (!confirm(`Delete "${r.frontmatter?.title || r.slug}"?`)) return;
      try {
        await deleteRecipe(r.slug);
        await refreshData();
        location.hash = "#/";
      } catch (e) {
        alert(e.message);
      }
    });

    if (STATIC_MODE) {
      $(".edit", node).hidden = true;
      $(".delete", node).hidden = true;
    }

    main.innerHTML = "";
    main.appendChild(node);
  }

  function showForm(slug) {
    const editing = !!slug;
    const r = editing ? state.recipes.find((x) => x.slug === slug) : null;
    if (editing && !r) { main.innerHTML = '<p class="empty">Recipe not found.</p>'; return; }
    const form = $("#tpl-form").content.firstElementChild.cloneNode(true);
    $(".form-title", form).textContent = editing ? "Edit recipe" : "Add recipe";

    // Category field: free text plus a dropdown of existing categories that
    // opens on focus and filters as you type.
    const catInput = form.elements.categories;
    const catList = $(".combo-list", form);
    if (catInput && catList) attachCombobox(catInput, catList, allCategories);

    if (editing) {
      const fm = r.frontmatter || {};
      form.elements.title.value = fm.title || "";
      form.elements.categories.value = categoriesOf(r).join(", ");
      form.elements.prep_minutes.value = Number.isFinite(fm.prep_minutes) ? fm.prep_minutes : "";
      form.elements.cook_minutes.value = Number.isFinite(fm.cook_minutes) ? fm.cook_minutes : "";
      form.elements.source_url.value = fm.source_url || "";
      const sections = parseBody(r.body);
      form.elements.ingredients.value = sections.ingredients.join("\n");
      form.elements.steps.value = sections.steps.join("\n");
      form.elements.notes.value = sections.notes.join("\n");
    }

    $(".back", form).addEventListener("click", () => history.back());
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = $(".form-error", form);
      errEl.textContent = "";
      const data = new FormData(form);
      const title = (data.get("title") || "").toString().trim();
      if (!title) { errEl.textContent = "Title is required."; return; }
      const cats = (data.get("categories") || "").toString()
        .split(",").map((s) => s.trim()).filter(Boolean);
      const prepRaw = (data.get("prep_minutes") || "").toString().trim();
      const prep = prepRaw === "" ? null : Number(prepRaw);
      const cookRaw = (data.get("cook_minutes") || "").toString().trim();
      const cook = cookRaw === "" ? null : Number(cookRaw);
      const src = (data.get("source_url") || "").toString().trim() || null;
      const ingredients = convertImperialList(
        (data.get("ingredients") || "").toString()
          .split(/\r?\n/).map((s) => s.trim()).filter(Boolean)
      );
      const steps = convertImperialList(
        (data.get("steps") || "").toString()
          .split(/\r?\n/).map((s) => s.trim()).filter(Boolean)
      );
      const notes = (data.get("notes") || "").toString()
        .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);

      let image = editing ? (r.frontmatter?.image || null) : null;
      const file = form.elements.image.files[0];
      const newSlug = editing ? r.slug : slugify(title);
      if (file) {
        try {
          image = await uploadImage(file, newSlug);
        } catch (err) {
          errEl.textContent = err.message;
          return;
        }
      }

      const payload = {
        slug: newSlug,
        frontmatter: {
          title,
          categories: cats,
          prep_minutes: prep,
          cook_minutes: cook,
          image,
          source_url: src,
        },
        body: buildBody({ ingredients, steps, notes }),
      };

      try {
        const res = await saveRecipe(payload, editing ? "update" : "create");
        await refreshData();
        location.hash = `#/r/${res.slug || newSlug}`;
      } catch (err) {
        errEl.textContent = err.message;
      }
    });

    main.innerHTML = "";
    main.appendChild(form);
  }

  // Free-text combobox over a comma-separated field. The dropdown opens on
  // focus (showing every option) and filters by the token after the last comma.
  function attachCombobox(input, listEl, getOptions) {
    let items = [];
    let activeIndex = -1;

    const tokens = () => input.value.split(",").map((s) => s.trim());
    const currentToken = () => tokens().pop() || "";
    const taken = () => new Set(tokens().slice(0, -1).filter(Boolean).map((s) => s.toLowerCase()));

    function open() {
      const tok = currentToken().toLowerCase();
      const used = taken();
      items = getOptions().filter((c) => !used.has(c.toLowerCase()) && c.toLowerCase().includes(tok));
      render();
    }

    function render() {
      if (!items.length) { close(); return; }
      listEl.innerHTML = items
        .map((c, i) => `<li role="option" class="${i === activeIndex ? "active" : ""}">${escapeHtml(c)}</li>`)
        .join("");
      listEl.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function close() {
      listEl.hidden = true;
      listEl.innerHTML = "";
      activeIndex = -1;
      input.setAttribute("aria-expanded", "false");
    }

    function choose(value) {
      const parts = tokens();
      parts[parts.length - 1] = value;
      input.value = parts.join(", ");
      close();
      input.focus();
    }

    input.addEventListener("focus", () => { activeIndex = -1; open(); });
    input.addEventListener("input", () => { activeIndex = -1; open(); });
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", (e) => {
      if (listEl.hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, items.length - 1); render(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); render(); }
      else if (e.key === "Enter" && activeIndex >= 0) { e.preventDefault(); choose(items[activeIndex]); }
      else if (e.key === "Escape") { close(); }
    });
    listEl.addEventListener("mousedown", (e) => {
      const li = e.target.closest("li");
      if (!li) return;
      e.preventDefault();
      const idx = Array.prototype.indexOf.call(listEl.children, li);
      if (idx >= 0) choose(items[idx]);
    });
  }

  function slugify(title) {
    return title
      .normalize("NFKD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[đĐ]/g, "d")
      .replace(/[^a-zA-Z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .toLowerCase() || "untitled";
  }

  // ----- escape helpers -----

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ----- routing -----

  function route() {
    const hash = location.hash || "#/";
    if (hash.startsWith("#/r/")) return showDetail(decodeURIComponent(hash.slice(4)));
    if (hash === "#/add") {
      if (STATIC_MODE) { location.hash = "#/"; return; }
      return showForm(null);
    }
    if (hash.startsWith("#/edit/")) {
      if (STATIC_MODE) { location.hash = "#/"; return; }
      return showForm(decodeURIComponent(hash.slice(7)));
    }
    return showList();
  }

  // ----- bootstrap -----

  async function refreshData() {
    state.recipes = await loadRecipes();
    refreshCategoryFilter();
  }

  // Icon for the view toggle. The button shows the view it will switch *to*.
  const VIEW_ICONS = {
    // grouped: stacked sections (offered while in flat view)
    grouped: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="2" rx="1"/><rect x="3" y="7" width="14" height="2" rx="1"/><rect x="3" y="14" width="8" height="2" rx="1"/><rect x="3" y="18" width="14" height="2" rx="1"/></svg>',
    // flat grid: four tiles (offered while in grouped view)
    flat: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>',
  };

  function renderViewToggle(btn) {
    const next = state.view === "grouped" ? "flat" : "grouped";
    const label = next === "grouped" ? "Group by category" : "Flat list";
    btn.innerHTML = VIEW_ICONS[next];
    btn.dataset.view = state.view;
    btn.title = label;
    btn.setAttribute("aria-label", label);
  }

  function wireBar() {
    const home = $("#home");
    home.addEventListener("click", () => { location.hash = "#/"; });
    home.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); location.hash = "#/"; }
    });
    $("#search").addEventListener("input", (e) => {
      state.query = e.target.value;
      if ((location.hash || "#/") === "#/") showList();
    });
    $("#category-filter").addEventListener("change", (e) => {
      state.category = e.target.value;
      if ((location.hash || "#/") === "#/") showList();
    });
    $("#toggle-images").addEventListener("click", (e) => {
      state.showImages = !state.showImages;
      document.body.classList.toggle("show-images", state.showImages);
      e.target.textContent = state.showImages ? "Hide images" : "Show images";
      e.target.dataset.state = state.showImages ? "shown" : "hidden";
    });
    const viewBtn = $("#toggle-view");
    renderViewToggle(viewBtn);
    viewBtn.addEventListener("click", () => {
      state.view = state.view === "grouped" ? "flat" : "grouped";
      renderViewToggle(viewBtn);
      updateCollapseAllBtn();
      if ((location.hash || "#/") === "#/") showList();
    });
    $("#toggle-collapse").addEventListener("click", () => {
      const names = currentGroupNames();
      const allCollapsed = names.length > 0 && names.every((n) => state.collapsed.has(n));
      if (allCollapsed) state.collapsed.clear();
      else names.forEach((n) => state.collapsed.add(n));
      if ((location.hash || "#/") === "#/") showList();
    });
    $("#random").addEventListener("click", () => {
      const pool = filteredRecipes();
      if (!pool.length) { alert("No recipes to pick from."); return; }
      const pick = pool[Math.floor(Math.random() * pool.length)];
      location.hash = `#/r/${pick.slug}`;
    });
    const addBtn = $("#add");
    if (STATIC_MODE) {
      addBtn.hidden = true;
    } else {
      addBtn.addEventListener("click", () => { location.hash = "#/add"; });
    }
  }

  window.addEventListener("hashchange", route);

  (async () => {
    wireBar();
    try {
      await refreshData();
    } catch (e) {
      main.innerHTML = `<p class="empty">Failed to load recipes: ${escapeHtml(e.message)}</p>`;
      return;
    }
    route();
  })();
})();

</script>
</body>
</html>
