<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cooking</title>
  <style>
:root {
  --bg: #fafaf7;
  --fg: #1a1a1a;
  --muted: #666;
  --accent: #b85c2c;
  --accent-fg: #fff;
  --border: #e5e3dd;
  --card-bg: #fff;
  --danger: #c0392b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  padding: 0.75rem 1rem;
}
.bar h1 {
  font-size: 1.25rem;
  margin: 0 0.5rem 0 0;
  cursor: pointer;
}
.bar input[type="search"],
.bar select,
.bar button {
  font: inherit;
  padding: 0.4rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--fg);
}
.bar input[type="search"] {
  flex: 1 1 14rem;
  min-width: 8rem;
}
.bar button {
  cursor: pointer;
}
.bar button:hover { background: #f0eee8; }
#add { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#add:hover { filter: brightness(0.95); }

.subbar {
  position: sticky;
  top: 0;
  z-index: 9;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  padding: 0.5rem 1rem;
}
.subbar select {
  font: inherit;
  padding: 0.4rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--fg);
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.35rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--fg);
  cursor: pointer;
  line-height: 0;
}
.icon-btn:hover { background: #f0eee8; }

main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem 1.5rem;
}

/* List */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.75rem;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  color: inherit;
  text-decoration: none;
}
.card:hover { border-color: var(--accent); }
.card .title {
  margin: 0;
  font-size: 1.05rem;
}
.card .meta {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}
.card .thumb {
  display: none;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 6px;
  background: #eee;
}
body.show-images .card .thumb[src] { display: block; }

.empty {
  color: var(--muted);
  padding: 2rem 0;
  text-align: center;
}

/* Grouped-by-category view */

.category-group { margin-bottom: 1.75rem; }
.category-heading {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  margin: 0 0 0.6rem;
  padding: 0.1rem 0 0.3rem;
  font: 600 1.1rem/1.3 inherit;
  text-align: left;
  color: inherit;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.category-heading:hover { color: var(--accent); }
.category-heading .chevron {
  flex: 0 0 auto;
  width: 0.65rem;
  height: 0.65rem;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}
.category-group.collapsed .category-heading .chevron { transform: rotate(-45deg); }
.category-heading .category-name { flex: 1 1 auto; }
.category-heading .category-count {
  flex: 0 0 auto;
  color: var(--muted);
  font-weight: 400;
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
}
.category-group.collapsed .recipe-lines { display: none; }
.category-group.collapsed .category-heading { margin-bottom: 0; }

#toggle-collapse {
  font: inherit;
  padding: 0.35rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--fg);
  cursor: pointer;
}
#toggle-collapse:hover { background: #f0eee8; }
.recipe-lines {
  display: flex;
  flex-direction: column;
}
.recipe-line {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: 0.35rem 0.25rem;
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid var(--border);
}
.recipe-line:last-child { border-bottom: none; }
.recipe-line:hover { color: var(--accent); }
.recipe-line-name { flex: 1 1 auto; }
.recipe-line-time {
  flex: 0 0 auto;
  text-align: right;
  color: var(--muted);
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
}

/* Detail */

.detail {
  max-width: 900px;
  margin: 0 auto;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
}
.detail .back,
.form .back {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
  margin-bottom: 0.75rem;
  font: inherit;
}
.detail h2 { margin: 0 0 0.25rem; }
.detail .meta { color: var(--muted); margin: 0 0 1rem; }
.detail .hero {
  display: none;
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  border-radius: 6px;
  margin-bottom: 1rem;
}
.detail .hero[src] { display: block; }
.detail h3 { margin: 1rem 0 0.4rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.detail ul, .detail ol { margin: 0; padding-left: 1.25rem; }
.detail li { margin: 0.15rem 0; }
.detail .source { margin: 1rem 0 0; font-size: 0.9rem; }
.detail .source a { color: var(--accent); }
.detail-actions { margin-top: 1.25rem; display: flex; gap: 0.5rem; }
.detail-actions button {
  font: inherit;
  padding: 0.4rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
}
.detail-actions .delete { color: var(--danger); border-color: var(--danger); }

/* Form */

.form {
  max-width: 900px;
  margin: 0 auto;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.9rem;
  color: var(--muted);
}
.form input,
.form textarea {
  font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--fg);
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
}
.form textarea { resize: vertical; min-height: 4rem; }

/* Category combobox (free text + dropdown of existing categories) */
.combo { position: relative; }
.combo input { width: 100%; }
.combo-list {
  position: absolute;
  z-index: 20;
  left: 0;
  right: 0;
  top: calc(100% + 2px);
  margin: 0;
  padding: 0.25rem 0;
  list-style: none;
  max-height: 12rem;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
}
.combo-list li {
  padding: 0.35rem 0.7rem;
  cursor: pointer;
  color: var(--fg);
  font-size: 0.95rem;
}
.combo-list li:hover,
.combo-list li.active { background: #f0eee8; }
.form-actions { display: flex; justify-content: flex-end; }
.form-actions button {
  background: var(--accent);
  color: var(--accent-fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 0.5rem 1rem;
  font: inherit;
  cursor: pointer;
}
.form-error {
  color: var(--danger);
  font-size: 0.9rem;
  margin: 0;
  min-height: 1.2rem;
}

</style>
</head>
<body>
  <header class="bar">
    <h1 id="home" role="button" tabindex="0">Cooking</h1>
    <input id="search" type="search" placeholder="Search…" />
    <button id="toggle-images" type="button" data-state="hidden">Show images</button>
    <button id="random" type="button">Random</button>
    <button id="add" type="button">+ Add</button>
  </header>
  <div class="subbar">
    <select id="category-filter" aria-label="Category">
      <option value="">All categories</option>
    </select>
    <button id="toggle-view" class="icon-btn" type="button" data-view="flat"></button>
    <button id="toggle-collapse" type="button" hidden>Collapse all</button>
  </div>

  <main id="main"></main>

  <!-- Recipe detail -->
  <template id="tpl-detail">
    <article class="detail">
      <button class="back" type="button">&larr; Back</button>
      <h2 class="title"></h2>
      <p class="meta"></p>
      <img class="hero" alt="" />
      <section class="ingredients"><h3>Ingredients</h3><ul></ul></section>
      <section class="steps"><h3>Steps</h3><ol></ol></section>
      <p class="source"></p>
      <div class="detail-actions">
        <button class="edit" type="button">Edit</button>
        <button class="delete" type="button">Delete</button>
      </div>
    </article>
  </template>

  <!-- List card -->
  <template id="tpl-card">
    <a class="card">
      <h3 class="title"></h3>
      <p class="meta"></p>
      <img class="thumb" alt="" />
    </a>
  </template>

  <!-- Form -->
  <template id="tpl-form">
    <form class="form">
      <button class="back" type="button">&larr; Back</button>
      <h2 class="form-title"></h2>
      <label>Title<input name="title" required></label>
      <label>Categories (comma-separated)
        <div class="combo">
          <input name="categories" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">
          <ul class="combo-list" role="listbox" hidden></ul>
        </div>
      </label>
      <label>Prep time (minutes)<input name="prep_minutes" type="number" min="0"></label>
      <label>Cook time (minutes)<input name="cook_minutes" type="number" min="0"></label>
      <label>Source URL<input name="source_url" type="url"></label>
      <label>Picture<input name="image" type="file" accept="image/*"></label>
      <label>Ingredients (one per line)<textarea name="ingredients" rows="8"></textarea></label>
      <label>Steps (one per line)<textarea name="steps" rows="10"></textarea></label>
      <label>Notes<textarea name="notes" rows="3"></textarea></label>
      <div class="form-actions">
        <button type="submit">Save</button>
      </div>
      <p class="form-error" role="alert"></p>
    </form>
  </template>

  <script>
const __BAKED_RECIPES__ = [{"frontmatter": {"title": "Adobo Chicken", "categories": ["Chicken"], "prep_minutes": 20, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- Main mix:\n- 4 chicken thighs (1kg)\n- 8 tbs white wine\n- 8 tbs soy sauce\n- 8 tbs brown sugar\n- 4 cloves garlic whole\n- 4 phalanx ginger\n- 3 green onions\n- 4 tsp black pepper\n- Optional\n- 2 bay leaf\n- Cinanmon stick\n- 1 onion, quartered\n\n## Steps\n1. Marinate Main mix overnight.\n2. Water enough to flood everything\n3. Bring to a boil then simmer 20 mins\n", "slug": "adobo-chicken"}, {"frontmatter": {"title": "Amish Meat Balls", "categories": ["Uncategorized"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g thịt bò/mix\n- 1/2 cup bread crumbs\n- 1/4 cup onion, minced\n- 2 eggs\n- 1 tsp oil (+)\n- 3/2 cups ketchup\n- 1 tsps vinegar\n- 1 tbs soy sauce\n- 3/4 cup brown sugar\n\n## Steps\n1. Cho thịt, bread crumbs, hành, trứng, ít tiêu và muối và 1 bát\n2. Viên thịt dạng vừa\n3. Medium-high heat, đun dầu (nhiều dầu 1 chút để không bị cháy thịt)\n4. Rán nâu thịt tầm 5 phút, thỉnh thoảng đảo\n5. Cho các gia vị còn lại vào 1 bát, đảo đều. Rồi đổ vào chảo, đậy nắp và đun tầm 20-25 phút hoặc khi thịt chín\n", "slug": "amish-meat-balls"}, {"frontmatter": {"title": "Apple crumble", "categories": ["Vegetables"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/CzcDruyKwF2/"}, "body": "## Ingredients\n- \n\n## Steps\n1. 3 medium apples\n2. Chop in small pieces then sauté in a chunk of butter.\n3. 2 Tbsp sugar\n4. a good dash of cinnamon\n5. Mix and cook on low heat for 5-10mins.\n6. Crumbles:\n7. 110g flour\n8. 90g soft vegan butter or margarine\n9. 70g sugar or brown sugar\n10. a pinch of salt\n11. Mix to get a crumbly mix.\n12. Evenly distribute over the apples (if your pan isn’t oven proof, use a baking dish).\n13. Bake at 180C for 30-35mins.\n14. 45min\n", "slug": "apple-crumble"}, {"frontmatter": {"title": "Asian Pork Tenderloin", "categories": ["Pork"], "prep_minutes": 480, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 800g Pork loin\n- 4 cloves of garlic\n- Ginger\n- 1/3 cup Soy sauce\n- 1/4 cup Sesame oil\n- 2 tbs Worchester sauce\n- 1/8 cup brown sugar\n- 3 green onions\n- 1 1/2 tsp pepper\n- 1 1/2 tbs chili paste\n\n## Steps\n1. Mix: soy sauce, sesame oil, Worcestershire sauce, brown sugar, green onions, garlic, chile paste, and pepper.\n2. Tenderloin in 8 hours at least.\n3. Preheat oven 230C\n4. Pork in alu folie\n5. Roast 25-30 mins.\n6. 5 min rest.\n", "slug": "asian-pork-tenderloin"}, {"frontmatter": {"title": "Bacon Sweet", "categories": ["Uncategorized"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- Bacon\n- Sugar\n- Salt/pepper\n- Garlic\n- Fish sauce\n\n## Steps\n1. 1-2 tbsp oil + 1tbsp sugar, high heat\n2. When browned, meat in with med heat.\n3. Add water or sugar\n", "slug": "bacon-sweet"}, {"frontmatter": {"title": "Baked Curry", "categories": ["Pork"], "prep_minutes": 45, "cook_minutes": null, "image": null, "source_url": "https://www.tiktok.com/@fitgreenmind/video/7280633344088460576"}, "body": "## Ingredients\n- Any group of vegtables for baking (Kohlrabi, Kurbis, Zucchini, Daikon…)\n- 3 carrots\n- 1 onion\n- 2 cloves garlic\n- a thumbsize piece of ginger\n- 1 can (400g) chopped tomatoes\n- 1 can (400ml) coconut milk\n- 200ml water\n- 1 can (220g) chickpeas (+ some green peas if you want)\n- 1 Tsp coriander, cumin, garam masala, paprika, turmeric\n- salt to taste\n\n## Steps\n1. Chop veggies.\n2. Mix everything.\n3. Bake at 200C for 45mins.\n4. Garnish with cilantro and lime juice\n", "slug": "baked-curry"}, {"frontmatter": {"title": "Balsamic Roasted Pork Loin", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g pork loin\n- 1 tbs steak seasoning (steak dry rub)\n- 1/4 cup olive oil\n- 1/5 cup balsamic vinegar\n\n## Steps\n1. Cho tất cả vào 1 túi plastic bag\n2. Ướp tầm 2 tiếng\n3. Cho vào lò 175oC tầm 1 tiếng\n", "slug": "balsamic-roasted-pork-loin"}, {"frontmatter": {"title": "Banana choco chip", "categories": ["Dessert"], "prep_minutes": 45, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/WI9XPRjJ3Eo"}, "body": "## Ingredients\n- 3 bananas (mashed)\n- 115 g butter\n- 150g brown sugar\n- 2 eggs\n- 1 tbsp vanilla\n- 120 ml of buttermilk\n- 120 ml greek yogurt or sour cream\n- 250g flour\n- 1 tsp of baking soda pinch of salt\n- 1 cup of chocolate chips\n\n## Steps\n1. Chill butter\n2. Preheat oven 175C\n3. save some choco chips for topping\n4. banana mashed + chilled butter + egg + sugar + yogurt + flour + choco chip\n5. Mix little\n6. bake at 175 C for about 45-50 minutes\n", "slug": "banana-choco-chip"}, {"frontmatter": {"title": "Basil Garlic Chicken", "categories": ["Chicken"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 tbs vegetable oil\n- 500g thịt gà băm\n- 1/4 cup sliced shallots\n- 4 cloves garlic, minced\n- (2 tbs minced  hot pepper)\n- a cup basil leaves, sliced very thin\n- Glaze:\n- 1/3 cup chicken broth\n- (1) 3 tbs soy sauce, or as needed\n- (1 tbs oyster sauce)\n- (2 tsp fish sauce)\n- 1 tsp white sugar\n- 1 tsp brown sugar\n\n## Steps\n1. Cho tất cả glaze vào 1 bát nhỏ và trộn đều\n2. Chuận bị tỏi, hành, basil và (hot pepper)→ paprika\n3. Max lửa → dầu ăn → rán thịt gà 2-3 phút( thịt bớt sống) → cho tỏi, hành và hot pepper vào chảo\n4. Khi bắt đầu caramelisation → cho 1/2 glaze vào chảo, đảo 1 lúc cho đến khi caramel. Rồi cho phần glaze còn lại vào và đảo 1 lúc.\n5. Tắt lửa, cho basil vào\n", "slug": "basil-garlic-chicken"}, {"frontmatter": {"title": "Beannies 1", "categories": ["Uncategorized"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/NuxLIbExiLU"}, "body": "## Ingredients\n- 10 Garlics\n- 2 onions\n- 200g sun-dried tomatoes\n- 1tbs tomato paste\n- Mixed seasoning.\n- 1tsp Cumin\n- 1tsp Turmeric\n- 2 cans beans\n- 1 can coconut milk\n- spinach\n- 1 Lemon\n- Nutritional yeast\n\n## Steps\n1. Cook garlic + onion + dried tomatoes + tomatoes paste with salt + cumin + turmeric.\n2. Add beans, coconut milk.\n3. Bubbling\n4. Spinach + lemon\n", "slug": "beannies-1"}, {"frontmatter": {"title": "Beans salad", "categories": ["Salad"], "prep_minutes": 15, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/NFWoidkA5SI"}, "body": "## Ingredients\n- 2 cans of beans\n- 1 can kirchenerbsen\n- 1 can corn\n- 1 bell pepper\n- 2 lime/lemons\n- 2 tomatoes\n- 1 avocado\n- 1 tbs Olive oil\n- Basil\n\n## Steps\n1. Rinse the beans\n2. Bean + erbsen + corn + pepper + tomatoes\n3. Lime + olive oil + basil\n", "slug": "beans-salad"}, {"frontmatter": {"title": "Beef, Bean & Lentil", "categories": ["Beef"], "prep_minutes": 20, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/ySFZQSDrtUc"}, "body": "## Ingredients\n- 15g (1 Tbsp) olive oil\n- 10 garlic cloves, grated\n- 170g tomato paste\n- 500g grounded beef\n- 1 tsp salt\n- 1 tsp Black pepper\n- 1 tsp red chili flakes\n- 1 tsp Italian seasoning\n- 425g canned lentils\n- 425g canned cannellini beans in vodka sauce\n- If you can't find these, use a plain can of cannelini beans + 1 cup store bought vodka sauce + 1 Tsp olive oil\n- 450ml beef broth\n- 336ml water\n- 336g pasta\n- 120g Greek yogurt/Milk\n- 30g parmesam\n\n## Steps\n1. Garlic + tomatoes paste some mins.\n2. Beef in until brown.\n3. 1 tsp salt\n4. 1 tsp Black pepper\n5. 1 tsp red chili flakes\n6. 1 tsp Italian seasoning\n7. 425g canned lentils\n8. 425g canned cannellini beans in vodka sauce\n9. 450ml beef broth\n10. 336ml water\n11. 336g pasta\n12. Cover lid, cook for 20 mins. Until thick and creamy.\n13. For finish, cilantro, milk/yogurt, parmesam\n14. Wraps\n", "slug": "beef-bean-lentil"}, {"frontmatter": {"title": "Beef goulash", "categories": ["Beef"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "http://www.hairybikers.com/recipes/view/beef-goulash#VwW4BD718UWGKIqG.97"}, "body": "## Ingredients\n- 1kg goulasch\n- 1 tbsp sunflower oil\n- 3 medium onions, cut into 12 wedges\n- 3 garlic cloves, crushed\n- 2 tsp hot smoked paprika\n- 1 tbsp paprika\n- 1 beef stock cube\n- 600ml cold water\n- 400g can of chopped tomatoes\n- 2 tbsp tomato purée\n- 2 bay leaves\n- 1 red pepper\n- 1 green pepper\n- 1 orange pepper\n\n## Steps\n1. Hành cắt to như goulash.\n2. Tẩm thịt bò với muối và tiêu.\n3. Rán thịt đến khi nâu đều các mặt\n4. Cho hành vào đảo tầm 5 phút/ đến khi hành mềm. Sau đấy đập và cho tỏi vào đảo tầm 1 phút.\n5. Cho paprika, beef stock, nước, bay leaves cà chua và tomato puree vào. Thêm muối và tiêu tùy thích.\n6. Dim tầm 90 phút.\n7. Cắt 3 ớt chuông vào sau 90 phút. Miếng tầm 3cm. Rồi dim thêm tầm 60 phút.\n", "slug": "beef-goulash"}, {"frontmatter": {"title": "Beef Stroganoff", "categories": ["Beef"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": "https://tiphero.com/easy-beef-stroganoff"}, "body": "## Ingredients\n- 500g sirloin steak\n- salt\n- pepper\n- 1 tbs olive oil\n- 3 tbs butter\n- 1 cup diced onion\n- 250g mushrooms, halved\n- 3 cloves minced garlic\n- ⅓ cup brandy, cognac, (wine)\n- 1½ cups beef stock\n- 1 tbs soy sauce\n- 1½ tsp dijon mustard\n- 3 Tablespoons flour\n- ½ cup sour cream, crème fraîche, or Greek yogurt\n- ¼ cup chopped parsley\n\n## Steps\n1. Cut the sirloin steak into thin strips and season it with salt and pepper.\n2. Oil and 1 tbs butter in skillet medium high heat. Cook strips in single layer. Move strips into a bowl.\n3. 2 tbs butter to skillet. Add the onions and sauté.\n4. Add mushrooms with salt, and cook until nicely browned.\n5. Add garlic and cook for 1 min.\n6. Deglaze with alcohol. Cook for 2 to 4 minutes until the liquid has reduced by about a third.\n7. In a large bowl: beef broth, soy sauce, mustard, and flour until smooth.\n8. Beef broth mixture to skillet, and stir. Simmer and cook for 5 mins. Stirring occasionally, until the sauce has thickened slightly.\n9. Turn the heat to low, and stir in the sour cream.\n10. Return the cooked steak to the pan and cook for 2 to 3 minutes, or until the steak is heated through.\n", "slug": "beef-stroganoff"}, {"frontmatter": {"title": "Bò và brocolli", "categories": ["Sauce"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g thịt bò cắt lát\n- Dầu ăn\n- Muối, tiêu\n- 3 miếng tỏi\n- 1/2 tsp ginger\n- (2 tbs sesame oil)\n- 1/3 cup soy sauce\n- 4tbs cup brown sugar\n- 4tbs cup honey\n- 1 cup beef broth\n- 1 brocolli\n- 2 tbs cornstarch + 2tbs water\n\n## Steps\n1. Chuẩn bị tỏi, beefbroth, gừng, brocolli\n2. Rán thịt bò với dầu ăn và tiêu, muối\n3. Vớt ra khi tái, gần chín\n4. Sạch chảo→ Lửa med→ Cho tỏi, gừng vào rồi đảo tầm 20s. → cho sesame oil, soy sauce, đường nâu, honey. Đảo đều rồi cho beefbroth và brocolli vào.\n5. Pha cornstarch với nước rồi đổ vào\n6. Dim 1 lúc cho đến khi sốt đặc lại thì cho bò vào lại.\n", "slug": "bo-va-brocolli"}, {"frontmatter": {"title": "Boneless pork cut", "categories": ["Pork"], "prep_minutes": 8, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 Pork loin\n- Sốt\n- (Chili Powder)\n- 3 tsp Paprika\n- 5-6 star anise\n- 2 tsp salt and pepper to taste\n- 1 tbs olive oil\n- thyme\n- 2 garlic, lightly smashed\n- 1 tsp coriander seeds\n\n## Steps\n1. Cho tất cả các sốt vào 1 đĩa\n2. Chộn đều rồi phết đều lên 2 mặt thịt\n3. Cho vào tủ lạnh vài tiếng\n4. Oven 200C\n5. Olive oil\n6. Rán lửa (med high), nâu 2 mặt\n7. Cho vào lò 8-10 phút.\n8. PORK RIB:\n", "slug": "boneless-pork-cut"}, {"frontmatter": {"title": "Buffalo Chicken Wings", "categories": ["Chicken"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=Lloo1Ksr3ms"}, "body": "## Ingredients\n- 500g chicken thighs\n- 1 teaspoon salt\n- ¼ cup unsalted butter\n- ¼ cup hot sauce\n- 3 tablespoons water\n- ⅓ cup finely chopped celery\n- + try other thing\n\n## Steps\n1. Heat a dry saucepan over high heat. Place thighs skin-side down in the hot pan and cook until skin is browned, seasoning generously with salt, about 5 minutes.\n2. Turn thighs over once skin no longer sticks to the pan. Add butter, Louisiana hot sauce, and water. Toss thighs around to stir the sauce until butter is melted.\n3. Heat to low, cover, and simmer until meat can be easily pulled from the bone, about 1 1/2 hours. Remove from heat and break meat up into smaller pieces using tongs, stirring it into the sauce. Let mixture cool to room temperature, at least 20 minutes.\n4. Bring the sauce in the pan to a boil over medium-high heat. reduce until slightly thickened, about 2 minutes. Pour sauce into the bowl of chicken meat and mix thoroughly. Taste for seasoning; add salt, cayenne, and hot sauce as needed. Add celery and mix one last time.\n5. Coq au vin, simplified\n6. 350g bacon\n7. 6-8 boneless, skinless chicken thighs, 1.5-2 lbs (0.7-1 kg)\n8. flour (a big pinch)\n9. brown mushroom\n10. 1 tbsp tomato paste\n11. 1 cup red wine or sour juice\n12. 1-2 cups (250-500 ml) chicken stock or water\n13. 1-2 teaspoons Herbes de Provence (or any combination of dried thyme, rosemary, oregano, etc)\n14. 1 cup frozen peeled pearl onions (or saute onion)\n15. Pepper, salt\n16. vinegar\n17. fresh parsley or tarragon for garnish\n18. Bacon in w/o heat. Cook in med heat, stirring occasionally, until crispy\n19. Coat the chicken thighs in a dusting of flour. When bacon is browned, chicken in. Bacon can stay or in another disk. Crowed is fine.\n20. After one side is browned, flip and add tomatoes puree in middle. Add red wine. Pour in enough water or stock to almost cover the chicken. Mushroom in. Pepper and herbs in. Lower heat and simmer for an hour.\n21. Taste and adjust the sauce.\n22. Chicken Paprikash\n23. https://www.allrecipes.com/recipe/283950/chef-johns-chicken-paprikash/\n24. 8 bone-in, skin-on chicken thighs\n25. salt\n26. olive oil\n27. 2 medium yellow onions, diced\n28. 5 cloves garlic, minced\n29. 2 tbs tomato paste\n30. 4 tsp all-purpose flour\n31. ½ tsp black pepper\n32. 1 tsp smoked paprika\n33. ¼ cup sweet Hungarian paprika\n34. 2 cups chicken broth\n35. ⅔ cup sour cream, room temperature\n36. ¼ cup heavy whipping cream\n37. Chop onion and garlic\n38. Salted chicken\n39. Brown both side\n40. Remove chicken\n41. Saute onion with salt\n42. Add garlic, flour, and tomato paste to make a roux\n43. Stir in salt, black pepper, smoked paprika, and sweet paprika and cook for 1 minute.\n44. Add chicken broth and bring to a simmer over high heat.\n45. Chicken in, cover pan, and cook for 45-60 mins.\n46. Remove chicken\n47. Whisk heavy cream and sour cream in. Bring to a simmer, stirring occasionally\n48. Chicken back, make warm\n49. Chicken - Drumsticks\n", "slug": "buffalo-chicken-wings"}, {"frontmatter": {"title": "Burgundy Pork Tenderloin", "categories": ["Pork"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g pounds pork tenderloin\n- ½ teaspoon garlic powder\n- 1 small onion, thinly sliced\n- 1 stalk celery/kohlrabi\n- 2 cups red wine/red grapes juice\n- 3 tbs (rind) gravy\n\n## Steps\n1. Preheat oven to 175C.\n2. Salt, pepper, garlic powder to meat.\n3. Brown the outside of the meat for 2 mins.\n4. Place pork in a baking dish with onion and celery, and pour wine over all.\n5. Bake in the preheated oven for 45 minutes.\n6. When done baking, remove meat from baking dish.\n7. Pour gravy mix into baking dish. Stir until thickened.\n8. PORK CHOP:\n", "slug": "burgundy-pork-tenderloin"}, {"frontmatter": {"title": "Burritos", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/InomOIjv6Q4"}, "body": "## Ingredients\n- 300g tater tot’s\n- 500g grounded beef\n- 200g cheddar\n- 3 peppers diced\n- 10 eggs\n- 6-10 wraps\n- ketchup\n\n## Steps\n1. Air fry/Oven taters\n2. Cook beef with pepper, then eggs\n3. Wrap it all up with ketchup\n", "slug": "burritos"}, {"frontmatter": {"title": "Can fishy tomaty", "categories": ["Seafood"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=Joyi0n8Uj6U"}, "body": "## Ingredients\n- 2 tbsp olive oil\n- 1 shallot\n- 4 cloves garlic\n- 1/2 tsp sweet smoked paprika\n- 400 g tomato sauce\n- 475 ml (2 cups) broth or water\n- 2 cans of tuna\n- 125g (1/2 cup) Greek yogurt Parsley\n\n## Steps\n1. Saute onion and garlic with parprika, snp\n2. Add in tomato sauce, snp,\n3. After 3 mins, broth in\n4. Fish in with cream\n5. #2\n", "slug": "can-fishy-tomaty"}, {"frontmatter": {"title": "Cassoulet", "categories": ["Uncategorized"], "prep_minutes": 120, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=g_Huy-0Xeek"}, "body": "## Ingredients\n- 200g white beans\n- Some slices of fatty pork ham (diced)\n- 200g sausage\n- 500g chicken leg\n- 1-2 carrots (diced)\n- 1 onion (diced)ss\n- 1-2 celeries (diced)\n- 4 Garlics (diced)\n- 1tbs tomatoes paste or any tomaty\n- Any 400ml stock\n- Any herbs (rosmary, 2 bay leaf or green herbs)\n\n## Steps\n1. White beans soaked in salt for 2 hours\n2. Brown ham with no oil\n3. Add sausage and butter (if not enough fat)\n4. Add chicken legg\n5. Add 2 carrots, 1 onion, 1 celery\n6. 4 Garlics\n7. Add stock\n8. Add herbs\n9. Cook for 60 – 90 mins\n10. HACKFLEISCH\n11. Thịt băm + nấm + tỏi tiêu đường + hành\n12. Thịt băm + ngô + trứng + cà chua + hành\n", "slug": "cassoulet"}, {"frontmatter": {"title": "Celery Soup (with leek)", "categories": ["Soup"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 celeries (250g)\n- 150g Butter\n- 1 white part of leek\n- 250g celeriac\n- 1 onion\n- (5 garlics cloves)\n- 1 small-medium size potato (g?)\n- Chicken/veggie broth (200ml?)\n- 500ml Sour/ heavy cream\n- (Milk)\n- Celeries leafs for garnish\n\n## Steps\n1. Everything are finely chopped\n2. Medium heat, butter.\n3. Add onion, celeries, leek ,celeriac.\n4. Cook softly(10-15 mins).\n5. Different pot, boil potatoes.\n6. Add double cream to potatoes pot.\n7. Add broth to potatoes pot.\n8. When the veggies are soft and sweated, the potatoes cream are close to boiling. Add the veggies to potatoes. Set it to gentle heat. Cook for 10 mins.\n9. But everything to blender and hit it. Around 1 min, has to be soupy texture.\n10. Add celeries leaf for garnish.\n11. Some changes would be appropiated here\n", "slug": "celery-soup-with-leek"}, {"frontmatter": {"title": "Celery Soup", "categories": ["Soup"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 celeries (400g), thinly sliced\n- 100g Butter or olive oil\n- 1 white part of leek\n- 250g celeriac\n- 1 onion, diced\n- 5 garlics cloves, chopped\n- 300g potatoes, 1,5cm sliced\n- 4 cups water + 1 tbs Chicken or veggie broth\n- 1 bay leaf\n- 1 tsp salt\n- 1/2 tsp pepper\n- 2,2g dill\n- 12g parsley\n- 115g Sour cream\n- Celeries leafs for garnish\n\n## Steps\n1. Oil/butter over medium heat\n2. Add onion, stirring occasionally, letting the onions get soft golden, about 5 minutes.\n3. Add garlic and stir 1-2 minutes, until fragrant.\n4. Add celery, potatoes, broth, bay leaf, salt, pepper. The liquid should just cover the veggies.\n5. Cover, bring to a boil, turn heat down and simmer gently until potatoes are tender, about 10 minutes.\n6. Turn heat off, remove bay leaf\n7. Add the herbs and cream\n8. Transfer to a blender. Blend well\n9. Add celeries leaf for garnish.\n", "slug": "celery-soup"}, {"frontmatter": {"title": "Cháo", "categories": ["Vegetables"], "prep_minutes": 60, "cook_minutes": null, "image": null, "source_url": "https://alcipedia.com/cocktails/aperol-sour-refreshing-and-delicious/"}, "body": "## Ingredients\n- Gạo\n- Gừng\n- Thịt (gà)\n\n## Steps\n1. Nấu cơm trong nồi tầm 1h. Gạo : nước 5.\n2. Luộc gà tầm 20-30 phút. Đến khi nhừ.\n3. Vớt gà. Xé gà. Gà, nước gà và gừng vào cháo. Đun thêm tầm 30 phút.\n4. Drinks\n5. Try:\n6. 50 aperol 30 limon 20 zucker syrup\n7. https://www.instagram.com/p/Czt_R0Xqqo7/\n8. 15 mins\n9. 1 cup (250ml) water\n10. 1 knob ginger, smashed or grated\n11. 1 stick of cinnamon\n12. 4 (4/6 tsp) cardamom pods\n13. 3 peppercorns\n14. 2 black tea bags\n15. 1 cup (250ml) milk of your choice\n16. 20g dark chocolate\n17. 1 Tbsp cacao powder\n18. First 5 ingredients\n19. Either lightly smash first or immediately put in hot water.\n20. Simmer for 2mins.\n21. Add tea bags\n22. Simmer for 2mins.\n23. Add milk, chocolate, cacao powder.\n24. Bring to a boil twice, then strain and serve warm.\n25. Either lightly smash first or immediately put in hot water.\n26. Simmer for 2mins.\n27. Simmer for 2mins.\n28. Bring to a boil twice, then strain and serve warm.\n29. Sauce\n", "slug": "chao"}, {"frontmatter": {"title": "Char Siu", "categories": ["Pork"], "prep_minutes": 240, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/258494/chinese-barbeque-pork-char-siu/"}, "body": "## Ingredients\n- 600g pork butt or fatty cut. Fat is important.\n- 4 tbs combination of (oyster + soy) sauce\n- 3 tbs combination of (hoisin + red wine) sauce\n- 4 tbs honey\n- 3 tbs brown sugar\n- 2 tbs chinese rice wine (sake, dry sherry)\n- 4 tbs ketchup\n- 4  garlic cloves, crushed\n- 1 tsp five-spice powder\n- 1/2 tsp black pepper\n- 1 thumb size giner\n\n## Steps\n1. All sauce together.\n2. Cut the meat to proper size if needed.\n3. Poke the meat and marinate 4-12 hours.\n4. Before cook room temperature.\n5. Preheat 150C\n6. In oven 60 mins.\n7. Brush marinate and flip.\n8. In oven 30 mins.\n9. https://www.youtube.com/watch?v=mglMQ7B3RAA\n", "slug": "char-siu"}, {"frontmatter": {"title": "Chè đậu xanh", "categories": ["Soup"], "prep_minutes": 120, "cook_minutes": null, "image": null, "source_url": "https://vtcnews.vn/cach-nau-che-dau-xanh-thom-ngon-tai-nha-ar865930.html"}, "body": "## Ingredients\n- 300g đậu xanh bóc vỏ\n- 100g sugar\n- 200ml coconut milk\n- 3 tbs Tapioca starch\n\n## Steps\n1. Soak the beans in water for 2 hours\n2. In a pan, water 1 cm higher, cook for 20 mins\n3. Add 0,5l water, cook for 15 mins\n4. Add sugar\n5. Starch with water, mix well, add to bowl. Turn to low heat.\n6. Add coconut milk.\n", "slug": "che-dau-xanh"}, {"frontmatter": {"title": "Cheese Meatloaf", "categories": ["Beef"], "prep_minutes": 240, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/229559/best-ever-meat-loaf/?internalSource=hub%20recipe&referringContentType=Search&clickId=cardslot%203"}, "body": "## Ingredients\n- 500g thịt băm\n- 1 egg\n- ⅔ cup milk\n- 2 tsp salt\n- ¼ tsp black pepper\n- 3 slices bread, crumbled\n- 1 onion, chopped\n- 1 cup shredded Cheddar cheese\n- ½ cup shredded carrot\n- ¼ cup brown sugar\n- ¼ cup ketchup\n- 1 tbs yellow mustard\n\n## Steps\n1. Preheat oven 175 C\n2. In a bowl: egg, milk, salt, and ground black pepper, crumbled bread and stir until dissolved.\n3. Mix ground beef, onion, Cheddar, and carrot into mixture.\n4. Makes a meatloaf. Ready to bake.\n5. Combine brown sugar, ketchup, and mustard in a bowl. Spread over meat mixture.\n6. Bake until no longer pink in the center, 1 to 1 1/4 hours.\n7. An instant-read thermometer inserted into the center should read at least 70 degrees C.\n8. Rest 10 mins\n", "slug": "cheese-meatloaf"}, {"frontmatter": {"title": "Chicken and Mushroom Casserole", "categories": ["Chicken"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=FU_The50Kis"}, "body": "## Ingredients\n- 4 -5 large chicken breasts\n- Salt and Pepper to taste\n- all-purpose flour\n- 6 Tbsp olive oil\n- 300g fresh mushrooms\n- 1 medium onion\n- 3 garlic cloves\n- Sauce:\n- 3 Tbsp unsalted butter\n- 3 Tbsp all-purpose flour for the sauce\n- 1½ cups chicken broth\n- 1 Tbsp lemon juice\n- ½ cup milk + ½ cup heavy cream\n\n## Steps\n1. Mushroom thickly sliced\n2. Onion finely diced\n3. Garlic minced\n4. Chicken 1 inch thick strips. Season: pepper, salt.\n5. Med high heat, brown both side, transfer to a baking dish.\n6. Saute mushroom, onion until brown. Add garlic. Transfer to baking dish or a bowl.\n7. Med low heat. Cook butter and flour for 2 mins. Add chicken broth, flour and lemon juice. Add milk and heavy cream.\n8. Pour sauce over chicken in a pot/baking dish.\n9. Bake 175C for 40 mins, or cook with stove.\n", "slug": "chicken-and-mushroom-casserole"}, {"frontmatter": {"title": "Chicken Breast and Basic Glaze", "categories": ["Chicken"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 chicken breast\n- Salt and Pepper to taste\n- 1tsp garlic\n- Juice/red wine\n- 1 tablespoon paprika\n- 2 tbs brown sugar\n\n## Steps\n1. Season chicken with salt, peper, and garlic.\n2. Brown both side\n3. Juice in pan with paprika and sugar.\n4. Simmer low heat for 10 mins.\n", "slug": "chicken-breast-and-basic-glaze"}, {"frontmatter": {"title": "Chicken Breasts in Caper Cream Sauce", "categories": ["Chicken"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/78741/chicken-breasts-in-caper-cream-sauce"}, "body": "## Ingredients\n- Seared sth (Chicken breast, pork  chop)\n- Season with any combination of (salt, pepper, garlic, onion, green stuf)\n- Whipping cream\n- Caper/Olive?\n\n## Steps\n1. Skillet to stove, heat to high.\n2. Whipping cream in, whisking continuously until reduced to sauce consistency, about 3 minutes.\n3. Remove from heat.\n4. (Stir in capers.)\n", "slug": "chicken-breasts-in-caper-cream-sauce"}, {"frontmatter": {"title": "Chicken chasseur", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=yMVGR3ibVvs"}, "body": "## Ingredients\n- 1 kg chicken pieces\n- 400g fresh button mushrooms\n- 1-2 shallots, onion\n- 1-2 carrots\n- 400mg can of tomatoes (crushed, diced, pureed, etc)\n- flour\n- chicken stock\n- soy sauce\n- brandy/cognac\n- white wine (or extra cognac)\n- butter\n- fresh herbs for garnish (tarragon?)\n- 1 package of egg noodles\n\n## Steps\n1. Cut mushrooms and carrot into small pieces.\n2. Sauteing.\n3. Dice the shallot and add it to the pan once the mushrooms and carrot look almost done.\n4. Season the chicken pieces heavily with salt and pepper and dust lightly with the flour.\n5. When the veg is soft, brown the chicken pieces. Remove the veg if needed.\n6. When the chicken is golden brown, deglaze the pan with brandy, add the vegetables back if necessary.\n7. Tomatoes, a little white wine, and enough stock to cover everything. Simmer until the chicken is as tender as you want it — I gave mine an hour.\n8. When the chicken is done, take the pieces out and boil the sauce down until thick. Taste and adjust seasoning.\n9. Return the chicken to the pan to coat and reheat, garnish with fresh herbs and serve with noodles.\n", "slug": "chicken-chasseur"}, {"frontmatter": {"title": "Chicken drumsticks", "categories": ["Chicken"], "prep_minutes": 15, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 tbs flour\n- 1 tsp salt\n- 0,5 pepper\n- curry powder\n- paprika\n- chicken seasoning (bart) tỏi và hành\n\n## Steps\n1. Preheat 210oC\n2. Cho tất cả gia vị và gà vào 1 túi, nồi\n3. Phủ đều gia vị lên gà\n4. Cho bơ lên giấy bạc và cho vào lò khi đến khi chảy đều hết\n5. Cho gà vào lò tầm 15 phút rồi lật\n6. 15 phút sau lấy ra ăn\n", "slug": "chicken-drumsticks"}, {"frontmatter": {"title": "Chicken Florentine | Garlic Spinach Chicken", "categories": ["Chicken"], "prep_minutes": 4, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=SsROVogvQuI"}, "body": "## Ingredients\n- 400g baby spinach\n- 2 chicken breast\n- 1/4 cup all-purpose flour\n- 4 tbs olive oil\n- 1 tbs butter\n- 4 cloves garlic\n- 1/4 cup minced shallots or onions\n- 3 tbs white wine\n- 1 tbs lemon zest, plus more to garnish\n- 1/2 cup diced red bell peppers\n- 1 cup heavy cream\n\n## Steps\n1. Cook spinat almost throguh.\n2. Season chicken on both sides with salt, black pepper, and coat evenly all over with the flour.\n3. Add 2 tbs olive oil to a pan, and heat over medium-high heat. Brown both side (4-5 mins)\n4. Add 2 tbs olive oil and butter to the pan. Heat to medium-high, and once butter melts, add garlic, shallots, and a pinch of salt. Cook, stirring, for about 1 minute. Add wine, and cook, stirring, until the wine reduces by half, a few minutes more.\n5. Add lemon zest and red peppers, and cook, stirring for another few minutes. Stir in cream, and bring mixture up to a simmer. Season to taste.\n6. Cook until sauce thicken. Add spinat back.\n7. Chicken back into the pan, and simmer on medium, until chicken is heated through, 3 to 4 minutes.\n", "slug": "chicken-florentine-garlic-spinach-chicken"}, {"frontmatter": {"title": "Chicken Marinate", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 chicken breast\n- Salt and Pepper to taste\n- 1 tsp garlic\n- 1 lemon, juiced\n- 1 tablespoon paprika\n- Olive oil\n\n## Steps\n1. Marinate overnight\n2. Cook\n", "slug": "chicken-marinate"}, {"frontmatter": {"title": "Chicken salat", "categories": ["Pork"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/sLo2Iz4LNaQ"}, "body": "## Ingredients\n- (rice)\n- Salad:\n- 1 - 2 large cucumbers thinly sliced 1 cup edamame\n- 1 bunch green onions thinly sliced 1 avocado chopped\n- Crispy chicken Tenders\n- Chopped peanuts\n- (Sweet Chilli Creamy Dressing)\n- 1/4 cup Greek yoghurt\n- 1/4 cup mayo (I used light)\n- 1/2 tsp paprika Water to thin\n\n## Steps\n1. Cook the chicken as instructed.\n2. Add cucumber, edamame, green onion, avocado, cooked chicken and (rice) to a large bowl.\n3. Make the dressing by whisking all ingredients until smooth using water to thin.\n4. Pour dressing over the salad and toss gently.\n5. Garnish with sesame seeds or peanuts.\n", "slug": "chicken-salat"}, {"frontmatter": {"title": "Chickpea and Sausage Stew", "categories": ["Beef"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": "https://gfycat.com/colossalbonyimpala-chickpea-and-sausage-stew-cooking-recipe-food"}, "body": "## Ingredients\n- 400g sausage\n- 1 onion finely diced\n- 1 sweet potatoe finely diced\n- 2 carrots finely diced\n- 6 cloves garlic minced\n- red pepper\n- 1 teaspoon dry thyme\n- 2 tablespoons butter\n- 2 tablespoons tomato paste\n- 4 cups chicken/veg stock\n- 400g chickpeas\n- 400ml can diced tomatoes\n- 2 teaspoons dry parsley\n- Salt and pepper\n\n## Steps\n1. Medium heat. Cook sausage (breaking it up with a wooden spoon) until well-browned.\n2. Transfer the sausage to a bowl.\n3. Drain off all but 2 tablespoons of fat in the pan.\n4. Med heat. add onion, sweet potato, and carrots. Cook, stirring occasionally, until softened. Season with salt and pepper.\n5. Add the garlic and chili pepper to the pan and cook for 1 minute.\n6. Melt the butter into the pot and add the thyme.\n7. Add the tomato paste and cook for 1 minute more until the paste deepens in color.\n8. Pour the stock into the pot and scrape up any browned bits stuck to the bottom.\n9. Return the sausage to the pot.\n10. Add the chickpeas and tomatoes. Bring to a boil and season with salt and pepper. Reduce heat and simmer for 30 minutes, stirring occasionally.\n", "slug": "chickpea-and-sausage-stew"}, {"frontmatter": {"title": "Classic Meatloaf", "categories": ["Beef"], "prep_minutes": 55, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g thịt băm\n- 1 cup dried bread crumbs\n- 1/2 cup diced yellow onion\n- 1/2 cup milk\n- 1 egg\n- 2 tbsp. ketchup\n- 1 tbsp. Worcestershire sauce\n- 1 tsp. dried parsley leaves (or any green)\n- 3/4 tsp. salt\n- 1/2 tsp. garlic powder\n- 1/4 tsp. ground black pepper\n- (cumin maybe?)\n- For the Topping:\n- 1/4 cup ketchup\n- 2 tbsp. packed light brown sugar\n- 1 tbsp. red wine vinegar\n\n## Steps\n1. Preheat oven to 175C.\n2. In a large bowl, add the beef, bread crumbs, onion, milk, egg, 2 tablespoons ketchup, (cumin), worcestershire sauce, parsley, salt, garlic powder, and pepper. Use your hands to mush and mix these ingredients together until well combined.\n3. Add the meat mixture to a loaf pan. Pat the meat down into an even layer.\n4. In a small bowl, add 1/4 cup ketchup, the brown sugar, and vinegar. Stir to combine. Pour the sauce on top of the meatloaf and spread it into an even layer.\n5. Bake uncovered for 55 minutes.\n6. Let the meatloaf rest for 8-10 minutes before serving (or it may fall apart).\n7. Bit bland\n", "slug": "classic-meatloaf"}, {"frontmatter": {"title": "Creamy Cajun Chicken", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://cookingwithgenius.com/creamy-cajun-chicken/"}, "body": "## Ingredients\n- 3 chicken thighs\n- Cornstarch\n- Cajun cream sauce:\n- 2 tbsp of butter\n- 1 onion, chopped\n- 4 cloves of garlic, minced\n- ½ cup of chicken broth\n- ½ cup of heavy cream\n- 1 cup of parmesan cheese\n- ½ lemon juice\n- A handful of spinach\n- Seasoning for the sauce:\n- 2 tbs of paprika\n- 1 tsp garlic powder\n- 1 tsp salt\n- 1 tsp cayenne pepper\n- 1 tsp dried thyme\n- 1 tsp onion powerder\n- 1 tsp black pepper\n- 1 tsp of chili flakes\n- 2 tsp of blend of dried herbs (oregna, thyme, basil…)\n\n## Steps\n1. Chicken + salt + pepper + cornstarch.\n2. Medium-high heat. Golden both side. Set aside.\n3. butter + onion +garlic. Sauté.\n4. Add in Cajun seasoning, paprika, chili flakes and Italian seasoning. Sauté for 30 seconds or until it is fragrant.\n5. Add in chicken broth, heavy cream and stir until the sauce thickens.\n6. Add in parmesan cheese, squeeze ½ lemon and give it a good mix until the cheese dissolves.\n7. Add back the chicken and baste the chicken with the sauce.\n", "slug": "creamy-cajun-chicken"}, {"frontmatter": {"title": "Creamy Chicken with Mushroom", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g chicken breast\n- Oil\n- 1 medium onion\n- 2 tablespoons butter divided\n- 3 garlic cloves\n- 200g mushroom\n- 470ml heavy cream\n\n## Steps\n1. Season with salt, pepper\n2. Medium-high heat.\n3. Brown chicken.\n4. Remove meat.\n5. Med heat.\n6. Oil and butter.\n7. Cook onion until soft.\n8. Add mushroom and cook until brownish.\n9. Add garlic and cook until fragant.\n10. Stir in the cream.\n11. Add salt and pepper (and sth sweet).\n12. Cook until thicken.\n", "slug": "creamy-chicken-with-mushroom"}, {"frontmatter": {"title": "Creamy Garlic Chicken", "categories": ["Chicken"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": "https://www.saltandlavender.com/creamy-garlic-chicken/"}, "body": "## Ingredients\n- 3 chicken breasts (halves)\n- Flour\n- 1 tablespoon olive oil\n- 2 tablespoons butter divided\n- 1 whole head garlic cloves peeled\n- 1/2 cup chicken broth or stock\n- 1/2 teaspoon lemon juice\n- 1/4 teaspoon garlic powder\n- 1 cup heavy/whipping cream\n- Salt & pepper to taste\n\n## Steps\n1. Season: salt, pepper and flour.\n2. Skillet over medium-high heat.\n3. Olive oil and 1 tbsp of the butter. Brown the chicken, then take the chicken and set it aside.\n4. Heat to medium, add the rest of the butter to the pan. Let it melt then add the garlic cloves. Cook for 3-4 minutes, stirring often, until they're lightly browned on the outside.\n5. Add the chicken broth, lemon juice, and garlic powder to the pan. Let it bubble for around 4 minutes or until the liquid is noticeably reduced.\n6. Stir in the cream and add the chicken back into the pan. Cook until the sauce is reduced. Serve with freshly chopped parsley if you wish.\n", "slug": "creamy-garlic-chicken"}, {"frontmatter": {"title": "Creamy garlic sauce", "categories": ["Sauce"], "prep_minutes": 6, "cook_minutes": null, "image": null, "source_url": "https://thecozycook.com/creamy-garlic-chicken/"}, "body": "## Ingredients\n- 2 ½ cups chicken broth\n- 1 beef bouillon cube\n- 1 tsp low sodium soy sauce, can sub Worcestershire sauce\n- 1 tsp onion powder\n- ½ tsp thyme,\n- ½ tsp mustard powder\n- 3 tbs butter\n- 10 whole cloves garlic\n- 3 tbs flour\n- ½ cup heavy cream\n- ½ cup Parmesan cheese, (optional)\n\n## Steps\n1. Broth mixture: chicken broth, bouillon cube, soy sauce, mustard powder, onion powder.\n2. Melt the butter in the skillet med-low heat.\n3. Add the garlic cloves and let them soften and caramelize for 6-7 minutes.\n4. Add the flour and cook for 1-2 minutes.\n5. Add the broth mixture in splashes, stirring continuously.\n6. Stir in the cream. Bring to a boil, then reduce heat to low.\n7. Add thyme, cheese.\n8. Add the protein back to the skillet.\n9. Cover partially and simmer for 5 minutes.\n10. Garnish with parsley.\n11. MISC\n", "slug": "creamy-garlic-sauce"}, {"frontmatter": {"title": "Creamy Mushroom Pasta and Steak", "categories": ["Beef"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?t=442&v=cs8OYby6RrA"}, "body": "## Ingredients\n- 250g steak\n- Oil\n- Salt, pepper\n- 1tbs Butter\n- 250g mushroom\n- 1 medium Onion\n- 2 tbs Hot paprika\n- Thyme\n- 1 Cup dry white wine\n- 2 cup chicken broth\n- 200g Pasta\n- worcestershire sauce\n- 200g sour cream\n\n## Steps\n1. Brown steak both side, move and cover in alu foil.\n2. Mushroom: Quartered\n3. Butter in till foamed\n4. Cook mushroom with salt till brown\n5. Lower heat, add onion cook till brown\n6. Add paprika and thyme for aprox 30s\n7. Add dry white wine and chicken broth\n8. Cook to rolling simmer, then add pasta\n9. When liquid down 90%, heat to low. Add a dash of worcestershire sauce and cream.\n10. Finish with parsley, salt and pepper.\n11. Cut steak. Move in to pan. Cover pan. Remove heat for 5 mins.\n", "slug": "creamy-mushroom-pasta-and-steak"}, {"frontmatter": {"title": "Creamy tuscan chicken", "categories": ["Chicken"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/DLk9miqP8Sd/"}, "body": "## Ingredients\n- Chicken:\n- 500g chicken breast fillets.\n- Salt to taste\n- 1 tsp smoked paprika powder\n- 1 tbsp garlic powder\n- 1 tsp Italian seasoning\n- 1 tsp black pepper\n- Sauce:\n- 2 cup unsweetened heavy whipping cream\n- 1 tbsp butter\n- 1 shallot or small onion, thinly diced\n- 8 cloves garlic, finely chopped\n- 1/2 red bell peppers, diced\n- Salt to taste\n- 1 tsp smoked paprika powder\n- 1 tsp garlic powder\n- 1 tsp black pepper\n- 1/2 tsp Italian seasoning\n- 1 tsp red chili flakes\n- 1/2 cup freshly grated Parmesan cheese\n- 1 cup spinach\n- 12 cherry tomatoes, halved\n- 2 tbsp tomato paste\n- 2 tbsp sun dried tomatoes\n\n## Steps\n1. Chicken + salt, pepper, garlic powder, smoked paprika powder, Italian seasoning and oil.\n2. Medium heat. Fully cook the chicken.\n3. Another pan: butter and oil medium heat.\n4. Once the butter is melted add shallots and garlic. Sauté until fragrant.\n5. Add cherry tomatoes and cook until mushy and soft. Add tomato paste along with seasonings , salt, pepper, garlic powder, smoked paprika, Italian seasoning, red chili flakes.\n6. Mix and add sun-dried tomatoes.\n7. Turn the heat to medium low and add cream.\n8. Once the sauce is ready add spinach. Cook for 1 minute.\n9. Chicken - Breast\n", "slug": "creamy-tuscan-chicken"}, {"frontmatter": {"title": "Crunchwrap", "categories": ["Beef"], "prep_minutes": 20, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/AD1ZjmPQVy8"}, "body": "## Ingredients\n- Burrito\n- 8 burrito-size tortillas\n- 500 g ground beef\n- 1 cup beef broth\n- 6 tsp taco seasoning (or homemade: 3 tsp chili powder, 3 tsp cumin, 2 tsp garlic powder, 2 tosp paprika, 1 tsp onion powder,\n- 1 tbs oregano, 1 tbs salt, 1 tbs black pepper)\n- 1½ cups shredded cheddar cheese\n- (6 tostadas)\n- 2 cups shredded lettuce\n- 2 tomatoes, diced\n- 1 cup sour cream\n- 3 tsp butter, melted\n- Creamy Taco Sauce\n- ½ cup sour cream or Greek yogurt\n- ½ cup mayonnaise\n- ⅓ cup milk or water\n- Juice of 1 lime\n- 1 tbsp taco seasoning\n- 1 tbsp dried parsley\n- ½ tsp paprika\n- ½ tsp garlic powder\n\n## Steps\n1. 1. Lay the tortillas around the edges of a sheet pan so the centers sit on the lip of the pan, then place one tortilla flat in the middle.\n2. Spread about ¾ cup sour cream across the tortillas.\n3. 2. In a skillet, cook the ground beef with taco seasoning and beef broth until browned and the liquid is absorbed.\n4. 3. Add the beef over the sour cream, then layer shredded cheese, tostadas, shredded lettuce, and diced tomatoes.\n5. 4. Add a tortilla with the remaining 1/4 cup sour cream in the middle. Fold the tortillas over the top to fully enclose everything, then brush with melted butter.\n6. 5. Top with another baking sheet and bake at 215C for 20 minutes. Remove the top sheet and bake for another 7 minutes until golden and crispy.\n7. Sauce\n8. 1. Add all ingredients to a bowl.\n9. 2. Whisk until smooth and fully combined.\n10. 3. Let sit for 15-30 minutes in the fridge if you have time.\n11. BEEF\n", "slug": "crunchwrap"}, {"frontmatter": {"title": "Cucumber Tahini", "categories": ["Vegetables"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": "https://www.tiktok.com/@fitgreenmind/video/7409399889530047776"}, "body": "## Ingredients\n- 1 cucumber\n- Cut in half, smash and cut in slices\n- 1 clove garlic\n- 1/2 tsp ginger\n- 1 Tbsp tahini\n- 3/4 Tbsp soy sauce\n- 1 Tbsp maple syrup or sugar\n- 1 Tsp (rice) vinegar\n- chili flakes and salt to taste\n- (tomatoes, bellpepper, nuts)\n\n## Steps\n1. Shake well and enjoy.\n", "slug": "cucumber-tahini"}, {"frontmatter": {"title": "Curried Coconut Chicken:", "categories": ["Chicken"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 600g thịt gà\n- 1 tsp salt and pepper\n- 1 tbs oil\n- 2 tbs curry powder\n- 1/2 sliced onion\n- 2 cloves garlic, minced\n- 430 ml coconut milk\n- 450 ml stewed, diced tomatoes\n- 240 ml tomatoes sauce\n- 3 tbs sugar\n\n## Steps\n1. Bóc tỏi và cắt hành\n2. Tẩm gà với muối và tiêu\n3. Cho dầu vào nồi nóng 1 lúc, cho curry powder vào nấu sốt (dễ cháy)\n4. Cho hành và tỏi vào đảo 1 lúc\n5. Cho gà vào nồi đảo 1 lúc\n6. Cho coconut milk, both types of tomatoes và đường vào nồi\n7. Đậy nắp và đun tầm 30-40 phút, nhớ đảo, khi thấy đặc vào là xong.\n", "slug": "curried-coconut-chicken"}, {"frontmatter": {"title": "Edamane snack salad", "categories": ["Salad"], "prep_minutes": 240, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/AhaNQDbNuV0"}, "body": "## Ingredients\n- 1 cup diced cucumber\n- 1 cup shelled edamame\n- 3 tsp soy sauce\n- 2 tsp rice vinegar\n- 1 tsp cane sugar\n- 1 tsp sesame oil\n- 1 tbsp chili oil\n- 1 garlic clove grated\n- 1/4 cup diced green onion\n- 1 tsp sesame seed\n\n## Steps\n1. Mix all together\n2. In the fridge for 4 hours+\n", "slug": "edamane-snack-salad"}, {"frontmatter": {"title": "Egg-Fried Rice Noodles with Chicken", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 chicken breast\n- Garlic\n- Soy sauce\n- Broccoli\n\n## Steps\n1. Chicken: strip and fry.\n2. Add salt, pepper.\n3. Add garlic.\n4. Add broccoli\n5. Add soysauce.\n", "slug": "egg-fried-rice-noodles-with-chicken"}, {"frontmatter": {"title": "Eggplant Bake", "categories": ["Seafood"], "prep_minutes": 25, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 2 eggplants\n- Cut in chunks.\n- a good drizzle of (olive) oil\n- salt to taste\n- 1 Tsp curry powder\n\n## Steps\n1. Mix and place on a baking tray.\n2. Bake at 200C/400F for 25-30mins.\n3. Serve with sriracha Mayo or your favorite sauce.\n", "slug": "eggplant-bake"}, {"frontmatter": {"title": "Eggy tomatoes sauce with sausage", "categories": ["Sausage"], "prep_minutes": 20, "cook_minutes": null, "image": "eggy-tomatoes-sauce-with-sausage-1781937850286.png", "source_url": "https://www.youtube.com/shorts/aw0gdRLnCes"}, "body": "## Ingredients\n- 2 tomatoes\n- 2 eggs\n- 200g sausages\n- 2 tbs minced garlic\n- sausage\n- 1/2 cup (119 ml) water\n- 2 tbs ketchup\n\n## Steps\n1. Cut tomatoes to small chunk\n2. Make the egg\n3. Make the sausage\n4. Add garlic, tomatoes and water\n5. Cook tomatoes until all juice get out\n6. Add soy sauce, oyster sauce, ketchup\n7. Add egg and sausage\n", "slug": "eggy-tomatoes-sauce-with-sausage"}, {"frontmatter": {"title": "Friedless Orange Chicken", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=5Sa9nYKiYg0"}, "body": "## Ingredients\n- 500mg chicken\n- 1 cup flour\n- 1/2 tsp garlic, minced\n- 1tbs garlic, minced\n- 1tbs sugar\n- 2tbs orange juice\n- 2tbs cup vinegar\n- 1tbs soy sauce\n- 0,5 tbs cornstach\n- 1tbs water\n- 0,5 tsb sesame oil\n\n## Steps\n1. Chicken 2x2 cubes + salt, pepper, and flour.\n2. Brown chicken. Remove.\n3. Pot over medium-high heat and add the oil.\n4. Once the oil begins to shimmer, add ginger, garlic, and cook for 30 seconds, stirring constantly.\n5. Add sugar and stir to combine.\n6. Add in the orange juice and allow the sugars to begin to dissolve in the liquid, stirring occasionally.\n7. Add in the vinegar and soy sauce, and stir to combine.\n8. Add the cornstarch and water together and whisk to combine. Add to the pan and stir.\n9. Continue to cook the sauce until maple syrup consistency is achieved.\n10. Add in the chicken and stir until completely coated in the sauce.\n11. Top with sesame oil.\n", "slug": "friedless-orange-chicken"}, {"frontmatter": {"title": "GARLIC EGGPLANT", "categories": ["Vegetables"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/CzZhTt9Ktnx/"}, "body": "## Ingredients\n- 30 mins\n- 2 eggplants\n- 2 Tbsp oil\n- 3 cloves garlic (minced)\n- a thumbsize piece of ginger (minced)\n- 2 spring onions (minced)\n- Sauce:\n- 4 Tbsp soy sauce\n- 4 Tsp sugar\n- (-2 Tsp corn starch)\n- some water to thin it out\n\n## Steps\n1. Eggplants into big chunks.\n2. Add a generous amount of salt and let it sit for 10mins.\n3. Drain, wash and pat dry.\n4. Fry in oil until they become soft and charred, then remove from the pan.\n5. Fry garlic, ginger and onion for 2mins before adding the eggplant again.\n6. Add the sauce\n7. Stir and cooked 1-2mins until thickened.\n", "slug": "garlic-eggplant"}, {"frontmatter": {"title": "Gazpacho", "categories": ["Uncategorized"], "prep_minutes": 120, "cook_minutes": null, "image": null, "source_url": "https://www.allrecipes.com/recipe/222331/chef-johns-gazpacho/"}, "body": "## Ingredients\n- Main:\n- 4 large fresh tomatoes, peeled and diced\n- ½ cucumber, peeled and diced\n- ½ cup finely diced red bell pepper\n- ¼ cup minced green onion\n- 2 cloves garlic, minced\n- ½ teaspoon ground cumin\n- 1 pinch dried oregano\n- Blender:\n- 1/3 from Main\n- 1 pint cherry tomatoes\n- 1 lime, juiced\n- ¼ cup extra-virgin olive oil\n- 1 tbs balsamic vinegar\n- 1 tsp Worcestershire sauce\n- 2 tbs thinly sliced fresh basil\n\n## Steps\n1. Combine Main in a large bowl.\n2. Stir in 1 tsp salt and black pepper\n3. Put Blender into the blender. Cover and purée until smooth.\n4. Pour puréed mixture through a strainer into the tomato-cucumber mixture; stir to combine.\n5. Place 1/3 of the tomato mixture into the blender. Cover, turn blender on, and purée until smooth. Return puréed mixture to the remaining tomato-cucumber mixture. Stir to combine. Cover and chill in the refrigerator for 2 hours.\n6. (Season cold soup with salt and black pepper to taste. Ladle into bowls and top with basil.)\n", "slug": "gazpacho"}, {"frontmatter": {"title": "Goulasch/Chunky", "categories": ["Beef"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- \n\n## Steps\n1. \n", "slug": "goulasch-chunky"}, {"frontmatter": {"title": "Greek Lemon Chicken & Potatoes", "categories": ["Chicken"], "prep_minutes": 25, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=h6OSMbfhIao"}, "body": "## Ingredients\n- 600g thịt gà\n- 1 củ khoai to\n- (1/2→) 1 tbs salt\n- 1/2 tsp black pepper\n- 1/2 tsp rosemary\n- 1/2 tbs oregano\n- 1/2 tsp hot pepper\n- 2 cloves of garlic( minced)\n- 1 lemon\n- 1/4 cup olive oil\n- 1/2 cup chicken broth\n- little oil\n\n## Steps\n1. Gọt khoai tây, cắt miếng vừa ăn, cắt tỏi hạt bé\n2. Preheat oven 220o\n3. Cho tất cả mọi thứ vào 1 cái bát to (trừ chicken broth và veg oil) và đảo đều.\n4. Ướp gà 2 tiếng hoặc nấu luôn\n5. Cho gà vào khay nướng, xẻ đều ra, da ở trên. Nướng 25 phút rồi đảo, da vẫn ở trên\n6. Sau 20 phút nữa thì cho gà ra và để khoai lại thêm tầm 10 phút\n", "slug": "greek-lemon-chicken-potatoes"}, {"frontmatter": {"title": "Honey Garlic Chicken:", "categories": ["Chicken"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 500g thịt gà\n- salt and pepper\n- 1 cup flour\n- 3,5 tbs unsalted butter\n- 2 cloves garlic, minced\n- 1,5 apple vinegar\n- 1tbs soy sauce (oyster sauce)\n- 1/3 cup honey\n\n## Steps\n1. Breats medium cut\n2. salt and pepper.\n3. Coat chicken in flour\n4. Melt 3,3 tbs butter in a large skillet over high heat.\n5. cook chicken for 2 – 3 minutes until golden. Turn and cook the other side for 1 minute.\n6. Heat down to medium high.\n7. Make room in the pan, add garlic and top with 0,2 tbs of butter. Stir garlic briefly once butter melts.\n8. Add vinegar, soy sauce and honey. Stir / shake pan to combine.\n9. Bring sauce to simmer, then simmer for 1 minute or until slightly thickened.\n10. Turn chicken to coat in sauce. If the sauce gets too thick, add a touch of water and stir.\n", "slug": "honey-garlic-chicken"}, {"frontmatter": {"title": "Japanese curry", "categories": ["Vegetables"], "prep_minutes": 45, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=qDrFJgjUz4s"}, "body": "## Ingredients\n- 500g chicken breast\n- Roux:\n- Butter\n- Flour\n- 1 tbs Curry\n- 1 tsp Garam Masala\n- Curry:\n- 3 cloves Garlic\n- 1 shallot\n- Soy sauce\n- Apple juice/vinegar\n- Honey (sugar)\n- Veggie:\n- 3 carrots\n- 3 potatoes\n\n## Steps\n1. Cắt cà rốt, khoai tây biting size. Chuẩn bị chicken broth.\n2. Nấu Roux: butter,  flour, Curry, Garam masala. Transfer to a bowl.\n3. Lửa 7/10, oil, minced garlic, shallots, salt, roux.\n4. Add: chicken, soy sauce, honey, sth chua(juice/vinegar), chicken broth,  veggie\n5. Simmer 45 mins.\n", "slug": "japanese-curry"}, {"frontmatter": {"title": "Jennifer Anistion salad", "categories": ["Salad"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/_-wektibW2U"}, "body": "## Ingredients\n- 400g chickpeas\n- 200g cooked quinoa\n- 1 cucumber, diced\n- 1/2 red onion, diced\n- 1/3 cup mint, chopped\n- 1/3 cup parsley, chopped\n- 1/2 cup pistachio, crumbled pecan\n- 1/2 cup Lemon vinaigrette:\n- ¼ cup fresh lemon juice\n- 1 tsp garlic powder\n- 1 tsp Dijon mustard\n- ¼ tsp salt\n- ¼ tsp black pepper\n- ½ honey, or maple syrup\n- ¼ to ⅓ cup extra-virgin olive oil\n- ½ ¼ thyme, optional\n\n## Steps\n1. Mix all together\n2. https://www.loveandlemons.com/lemon-vinaigrette/\n3. Soup\n", "slug": "jennifer-anistion-salad"}, {"frontmatter": {"title": "Keema Beef Curry", "categories": ["Beef"], "prep_minutes": 1, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 tbsp olive oil\n- 1 lb ground beef\n- 1 large onion, diced to 1/2\"\n- 1 tbsp grated fresh ginger\n- 2 cloves garlic, minced\n- 1 tsp salt and black pepper\n- 3/2 tbsp curry powder\n- 1 tsp garam masala\n- 1/2 tsp turmeric\n- 1 tbsp tomato paste\n- 400ml can fire-roasted diced tomatoes\n- 400ml coconut milk\n- 1 cup frozen baby peas\n\n## Steps\n1. Medium high heat. Cook until no longer pink.\n2. Add onion, ginger, and garlic. Sautee, stirring frequently, until softens and turns translucent.\n3. Add the salt, pepper, curry powder, garam masala, turmeric, and tomato paste. Stir until the spices are fragrant and the tomato paste is worked into the beef, about 1 minute.\n4. Add the tomatoes and coconut milk and give everything a good stir. Bring the liquid to a boil, then reduce to medium low. Simmer, stirring occasionally, until the curry thickens and the color turns a deep golden orange.\n5. Stir in the frozen baby peas and roasted potatoes. Simmer until the peas are warmed through.\n", "slug": "keema-beef-curry"}, {"frontmatter": {"title": "Kladdkaka - Cocoa powder", "categories": ["Uncategorized"], "prep_minutes": 20, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/fdmT-rPP6jI"}, "body": "## Ingredients\n- 115g butter, melted\n- 250g white sugar\n- 2 eggs\n- 1 tbs vanilla extract\n- 25g unsweetened cocoa powder\n- 1 pinch salt\n- 60g all-purpose flour\n\n## Steps\n1. Butter melted then in a tray\n2. Sugar in then mix\n3. Egg in then mix\n4. Vanilla, koko powder, salt, flour together and mix\n5. 180C for 20 mins\n6. Vegan\n", "slug": "kladdkaka-cocoa-powder"}, {"frontmatter": {"title": "Kokosmakronen", "categories": ["Uncategorized"], "prep_minutes": 20, "cook_minutes": null, "image": null, "source_url": "https://www.chefkoch.de/rezepte/2635801414048554/Kokosmakronen.html"}, "body": "## Ingredients\n- 140 g\tKokosraspel\n- 4\tEiweiß\n- 200 g\tZucker, feiner\n- 80\tOblaten\n\n## Steps\n1. Sugar, Coconus and Eggwhite together in a pot together.\n2. Warm it up to 50C. Not higher.\n3. Making a mass on top of the Oblaten (with 2 tea spoons).\n4. A bit water on top of backpaper will make the Oblate to not move so much.\n5. Backofen bei 150°C Ober-/Unterhitze ca. 20 Minuten backen.\n", "slug": "kokosmakronen"}, {"frontmatter": {"title": "Lemon Pepper Baked Chicken", "categories": ["Chicken"], "prep_minutes": 3, "cook_minutes": null, "image": null, "source_url": "https://www.delish.com/cooking/recipe-ideas/recipes/a55218/lemon-pepper-baked-chicken-breast-recipe/"}, "body": "## Ingredients\n- 500g chicken breast (halved)\n- 1/2 cup chicken broth\n- 2 tbs butter\n- 4 cloves garlic\n- 1 lemon\n- MIX:\n- 1 tsp Salt\n- 1 tsp (lemon) Pepper\n- 1/2 cup flour\n- zest of 1 lemon\n\n## Steps\n1. Combine MIX.\n2. Coat chicken.\n3. Slice the lemon into slices.\n4. Cook chicken in oil until brown on both side.\n5. To skillet: butter, garlic, and lemon slices.\n6. Broth to skillet.\n7. Cook until chicken is cooked through and sauce has reduced slightly (3 minutes).\n", "slug": "lemon-pepper-baked-chicken"}, {"frontmatter": {"title": "Meatballs With Tomatoes Sauce", "categories": ["Beef"], "prep_minutes": 10, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=W3YVmSMl-fY"}, "body": "## Ingredients\n- 500g thịt băm\n- 4 small onions\n- 6 cloves of garlics\n- 200g can tomatoes\n- 500g tomatoes\n- 1/2 tbs tomatoes puree\n- 1 tbsp (sherry) vinegar\n- 1 tsp sugar\n- Basil\n- Thyme\n- Rosmarin\n\n## Steps\n1. In a bowl: 1 (cooked) onion, 2 (cooked) garlic, rosamrin, thyme, meat, salt, pepper.\n2. Make meatballs. Chill the balls for a while.\n3. In a stove, low heat: oil, 3 small chopped onions, 4 whole garlic, closed lit for 10-15 mins.\n4. Add chopped tomatoes, can tomatoes, vinegar, sugar. Cook for 40 mins, medium heat, stir.\n5. Add basil to the sauce\n6. Cook the meatballs (in different pan or oven 200C), then throw in the sauce for 10 mins.\n7. Pork Gravy\n8. 500g thịt lợn/ lợn mix bò\n9. 1 tbs salt\n10. 0,5 tbs sugar/ brown sugar\n11. 1 tsp sage?\n12. 1 tbs pepper\n13. 1 tbs hot pepper/ bột cay gì đấy...\n14. 3 tbs butter\n15. 1/4 cup flour ( nửa bát nhỏ thủy tinh)\n16. 3 cups of milks\n17. Hành lá????\n18. Tẩm muối, đường, bột tiêu và các gia vị khác với thịt\n19. Giang cho đến khi chín hết thịt, không để thịt vón cục..\n20. Cho bơ vô rồi giang đến khi chảy hết bơ\n21. Rải bột đều ra và đảo vài phút, để mix đều với bơ\n22. Cẩn thận cháy đít nồi\n23. Cho sữa vô khuấy đều, tầm 10 phút\n24. Cho hành lá vô\n", "slug": "meatballs-with-tomatoes-sauce"}, {"frontmatter": {"title": "Mole Poblano With Pork Tenderloin", "categories": ["Pork"], "prep_minutes": 15, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 Pork loin (500g)\n- 2 Shallots /1 med onion\n- 4 Garlic cloves\n- 40g Butter\n- 2 canned chipotle peppers\n- 1 tsp peanut butter\n- 1/2 tsp ground cumin\n- 1/2 tsp dried oregano\n- 1/4 tsp ground cinnamon\n- 1/4 tsp (at most) ground cloves\n- 3/4 tsp flour\n- 1 tsp tomato paste\n- 1-2 tbs any fruit preserves\n\n## Steps\n1. Remove the connect tissue\n2. Salt and pepper the loin\n3. Sear in med-high heat. Move constantly.\n4. Heat to med-low. Add garlic, shallots, and butter.\n5. Cook meat for around 15 mins. 63C is good.\n6. Add chitpole pepper (or sth similar) and peanut butter\n7. Add some cocoa powder.\n8. Add cinnamon, cumin, oregano, cloves\n9. Add pinch of flour\n10. Tomato paste\n11. Degalze with broth or water\n12. Reduce to thick sauce\n13. Add some preserved fruit or dried fruit.\n", "slug": "mole-poblano-with-pork-tenderloin"}, {"frontmatter": {"title": "Mushroom soup", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=5qRexHDwfds"}, "body": "## Ingredients\n- 454g fresh mushrooms (cremini would be a safe bet)\n- 30g dried mushroom (porcini would be a safe bet)\n- 1 onion\n- 1 cup (237mL) brandy (or whiskey, or white wine)\n- 4 cups (946mL) water\n- 1 cup (237mL) cream (could use coconut cream instead\n- 3-4 garlic cloves\n- 1/4 cup (30g) flour\n- 2 tbs Worcestershire sauce (could use soy sauce or yeast extract instead)\n\n## Steps\n1. Peel and roughly chop the onion. Heat a film of olive oil in a deep pan/pot and sauté the onion until soft and brown. Melt in a couple tablespoons of butter (or more olive oil) and stir in the flour to make a roux. Fry the roux a few minutes until it's starting to go brown and smell nutty.\n2. Deglaze the pan with 3/4 of the brandy. Gradually stir in the water until smooth. Stir in the dried mushrooms, the Worcestershire sauce, grind in some pepper, cover and let simmer for at least a half hour (an hour is better).\n3. Wash your fresh mushrooms, trim off any woody bits of stem they have and slice them thin. Heat a thick film of olive oil and melted butter (or oil) in a wide pan, stir in the mushrooms and give them a pinch of salt and a few grinds of pepper.\n4. Stir the mushrooms until they release a ton of water and start simmering. At that point, you have a few minutes in which you can peel and mince the garlic. Once the water boils out of the mushrooms, you'll need to stir constantly to keep them from burning. Fry them until they've shrunk a lot and are brown. Stir in the garlic and fry it for a few minutes. Deglaze with the remaining brandy, take if off the heat and reserve until the soup base is done.\n5. When the soup base is done simmering, puree it until smooth. Stir in the fresh mushroom mixture and 3/4 of the cream. Gently boil the soup for a few minutes until the cream thickens a bit. Taste and adjust seasoning. If you didn't use any alcohol, remember to give it a splash of vinegar to taste now. Add cream now or for garnish.\n", "slug": "mushroom-soup"}, {"frontmatter": {"title": "Oatmeal", "categories": ["Dessert"], "prep_minutes": 5, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/shorts/wNNSQ6Na8F8"}, "body": "## Ingredients\n- 0,7 cup oat\n- 1 egg\n- 1 teaspoon cinnamon\n- 1 tsp baking powerder\n- ¼ teaspoon salt\n- 1 over ripe bananas\n- 1 ½ cups almond milk\n- 2 big tbs creamy_peanut butter\n- 1 tbs maple syrup\n- 1 tsp chia seed\n- ½ tsp vanilla extract\n\n## Steps\n1. Oven 190C\n2. Baking dish: Oats, cinnamon, baking powder and salt.\n3. Mixing bowl: mashed banana, almond milk, peanut butter, maple syrup, flaxseed and vanilla extract.\n4. 5 minutes for the flaxseed to set.\n5. Mixing bowl -> baking dish.\n6. ﻿﻿﻿Bake uncovered until the top of the oatmeal is golden and the mixture is set, about 30-35 minutes.\n7. Cool for 5 minutes.\n", "slug": "oatmeal"}, {"frontmatter": {"title": "Old Fashioned Chicken", "categories": ["Chicken"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1kg thịt gà\n- 1 củ hành to\n- 400 gram white beans\n- 4 củ khoai\n- 800g tomatoes diced tomatoes can\n- 2 tbs tomato puree\n- 0,5 tbs muối\n- 2 tsp garlic powder\n- (2 tsp dried tarragon)\n- 1 tsp paprika powder\n- 1 tsp curry\n- 50 ml chicken stock\n\n## Steps\n1. Rải muối lên gà rồi rán đến khi vàng nâu 2 mặt\n2. Cho hành cắt nhỏ vào nấu tầm 2 phút\n3. Cho white beans, khoai, cà chua cắt bé, tomato puree và gia vị vô\n4. Đổ ít nước sôi vô rồi ninh độ 30 phút\n", "slug": "old-fashioned-chicken"}, {"frontmatter": {"title": "One Pan Brown Sugar Pork & Apples", "categories": ["Pork"], "prep_minutes": 30, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 1 1/2 to 3 pounds pork tenderloin\n- salt and pepper, to taste\n- 3 tablespoons oil\n- 1/2 cup brown sugar\n- 3 tablespoons Dijon mustard\n- 1 tablespoon minced garlic\n- 2 tablespoons apple juice\n- 2 medium apples, sliced into wedges\n\n## Steps\n1. Ướp thịt với muối và tiêu.\n2. Mix (1tbs oil) đường, mù tạt, tỏi và nước táo với nhau. Ướp thịt với mix này.\n3. Tầm 30 phút hoặc qua đêm.\n4. Xong rồi rán trên chảo nóng vs dầu ăn. 2,3 phút lật 1 lần. Sau 10 phút cho táo vào rán cùng cho đến khi thịt chín\n5. Thêm thyme hoặc parsley khi serve\n", "slug": "one-pan-brown-sugar-pork-apples"}, {"frontmatter": {"title": "One-Pan Chicken Shawarma Rice Bowls", "categories": ["Chicken"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/DVeYp8IEkqd/"}, "body": "## Ingredients\n- For the Chicken:\n- 700g chicken thighs/breast\n- 1 tbsp paprika\n- 1 tbsp cumin\n- 1 tbsp onion powder\n- 2 tsp coriander\n- 1 tsp allspice\n- 2 tsp turmeric\n- 2 tsp pepper\n- 2 tsp salt\n- 3 tbsp olive oil\n- 8 garlic cloves\n- ½ lemon, juiced\n- 2 tsp chicken boulion\n- For the Rice:\n- 3 tbsp butter + 1 ½ cups yellow onion, diced\n- 1 tbsp turmeric, 2 tsp paprika, 2 tsp garlic powder, 2 tsp pepper\n- 1 ½ cups rice\n- 3 cups hot water\n- 3 tsp chicken boulion\n- Garlic Sauce:\n- ¼ cup mayonnaise + ¼ cup plain Greek yogurt\n- 2 to 3 garlic cloves + 1 tbsp fresh parsley\n- 1 tsp salt + 1 tsp black pepper\n- ½ lemon, juiced + 1 tbsp olive oil\n\n## Steps\n1. In a bowl, combine the chicken with the spices, olive oil, garlic, lemon juice and chicken boulion.\n2. Marinate.\n3. medium-high heat, olive oil.\n4. Cook until golden and cooked through.\n5. Set aside.\n6. medium-low.\n7. Add butter to the same pan then the onions, stirring often, until translucent.\n8. Add the garlic & spices, cook for 1 to 2 mins.\n9. Add the rice and toast for 2 mins while stirring.\n10. Pour in the hot water mixed with chicken boulion. Stir & bring to a boil.\n11. Once boiling, cover & reduce heat to low.\n12. Simmer for 20 mins until cooked.\n13. Chicken - Things\n", "slug": "one-pan-chicken-shawarma-rice-bowls"}, {"frontmatter": {"title": "One-Pot braised beef Rigatoni", "categories": ["Beef"], "prep_minutes": 2, "cook_minutes": null, "image": null, "source_url": "https://www.instagram.com/p/DS3Rz7Ekh1R/"}, "body": "## Ingredients\n- 1kg Chuck Roast\n- Vegtables:\n- 1 large Carrot diced\n- 3 stalks Celery diced\n- 1 large white Onion diced\n- 3 cloves Garlic\n- 2 tablespoons Tomato paste\n- 4 cups Beef broth\n- 4 cups Crushed tomatoes\n- 1 cup Water\n- 2 sprigs Thyme\n- 2 sprigs Rosemary\n- 3 Bay leaf\n- 2 tbs Salt\n- 1 tbs black Pepper\n- 1/2 bunch Basil\n- 2 tbs fresh Parsley chopped\n- 1 cup Parmesan cheese\n\n## Steps\n1. Beef into large even sized chunks and season throughly with salt and pepper.\n2. Medium high heat oil.\n3. Sear beef on all sides then remove from pot.\n4. To the same pot add your vegetables and allow to cook for 2-3 minutes while stirring.\n5. Add garlic, tomato paste and cook with the vegetables for 2-3 minutes.\n6. Add your broth, crushed tomato, water, thyme, rosemary and bay leaves and bring this to a simmer.\n7. Add your seared beef back in and allow to simmer on low heat for 2 hours.\n8. (Shread meats)\n", "slug": "one-pot-braised-beef-rigatoni"}, {"frontmatter": {"title": "One pot creamy cajun sausage pasta", "categories": ["Pork"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=FP6E3JtmsCE"}, "body": "## Ingredients\n- 400g sausage\n- 1/2 yellow onion\n- 1 red bell pepper\n- 400g roasted tomatoes\n- 2 garlic cloves\n- 475–710 ml beef broth\n- 225g pasta\n- 1/2 cup heavy cream\n- 85g cream cheese\n- 400g any beans\n- For the Cajun Seasoning:\n- 1 tsp salt\n- 1 tsp pepper\n- 1 tsp paprika\n- 1/2 tsp cumin\n- 1/2 tsp thyme\n- 1 tsp garlic powder\n- 1 tsp onion powder\n- 1/2 tsp cayenne\n\n## Steps\n1. Brown sausage and remove from pan\n2. Onion, pepper + cajun seasoning + garlic\n3. 30s\n4. 400g tomatoes + beef broth + pasta + heavy cream + beans\n5. PORK LOIN:\n", "slug": "one-pot-creamy-cajun-sausage-pasta"}, {"frontmatter": {"title": "Orange chicken", "categories": ["Chicken"], "prep_minutes": null, "cook_minutes": null, "image": null, "source_url": "https://www.youtube.com/watch?v=zc63e7ZKUrg"}, "body": "## Ingredients\n- 1 crown of broccoli, cut into florets\n- 500g boneless, skinless chicken thighs, cut into large chunks\n- Cornstarch\n- 3 cloves garlic, minced\n- 1-inch piece ginger, minced\n- Zest of 1 orange\n- Juice of 1 large orange\n- 1/4 cup soy sauce, to taste\n- Rice vinegar, to taste (approximately 2 tbsp)\n- 1/4 cup granulated sugar\n\n## Steps\n1. Steam/Boil Broccoli until just fork-tender.\n2. Move the broccoli to cold water to stop cooking.\n3. Season the chicken chunks with salt and cornstarch until they are not wet or sticky.\n4. Cook chicken until crusts are formed.\n5. Mince the garlic and ginger.\n6. Zest the orange and set aside.\n7. Once the chicken is half cooked, add the minced garlic and ginger. Stir-fry for about a minute.\n8. Deglaze the pan with soy sauce, rice vinegar, and orange juice. Add the granulated sugar and stir well.\n9. Return the broccoli to the pan and stir to combine. The moisture from the broccoli will help prevent the sauce from burning.\n10. Soy sauce and vinegar to taste.\n11. Scatter a bit of cornstarch over the dish and stir aggressively to thicken the sauce.\n12. Add orange zest, then turn off the heat.\n13. Give the dish a final stir after cleaning up to prevent the zest from becoming bitter.\n", "slug": "orange-chicken"}, {"frontmatter": {"title": "Oven Chicken Legs", "categories": ["Chicken"], "prep_minutes": 45, "cook_minutes": null, "image": null, "source_url": null}, "body": "## Ingredients\n- 600g chicken legs\n- ¼ cup butter, cubed\n- Chicken broth\n- hot red pepper sauce\n- ½ teaspoon garlic powder\n- ½ teaspoon onion powder\n- salt and pepper to taste\n- or any powder\n\n## Steps\n1. Drumsticks in a oven or slow cooker.\n2. All ingredients sprinkle evenly with pieces of butter.\n3. Oven: 180C for 45 mins or until tender.\n4. Fish\n5. Bake fish in oven 220C 15
